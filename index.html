<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1D3573" />
<title>Marmita Lucrativa · by Lidera</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#1D3573;--navy-700:#172b5e;--navy-900:#10203f;
  --gold:#A48A57;--gold-soft:#C2A875;--off:#F2F2F2;
  --bg:#F5F6F9;--card:#FFFFFF;--line:#E6E8EE;--ink:#1B2235;--muted:#6B7384;--soft:#9AA1B1;
  --green:#1E9E6A;--green-bg:#E5F4EC;--red:#D2483F;--red-bg:#FBE9E7;
  --amber:#C9892A;--amber-bg:#FBF1DE;--blue-bg:#E9EDF7;
  --radius:14px;--shadow:0 1px 2px rgba(16,32,63,.04),0 8px 24px rgba(16,32,63,.06);--shadow-lg:0 12px 40px rgba(16,32,63,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;height:100vh;overflow:hidden}
.serif{font-family:'Fraunces',Georgia,serif}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}

.sidebar{width:248px;flex-shrink:0;background:#1D3573;color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:26px 24px 22px;flex-shrink:0}
.brand .wm{font-size:30px;font-weight:600;letter-spacing:-.5px;line-height:1}
.brand .sub{font-size:9px;letter-spacing:2.6px;color:var(--gold-soft);margin-top:7px;font-weight:600}
.brand .prog{font-size:11px;color:rgba(255,255,255,.5);margin-top:12px}
.nav{padding:6px 14px;flex:1;overflow-y:auto}
.nav .lbl{font-size:10px;letter-spacing:1.6px;color:rgba(255,255,255,.4);padding:12px 12px 5px;font-weight:600}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.78);text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:.15s;position:relative;cursor:pointer;user-select:none}
.nav a svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:rgba(255,255,255,.12);color:#fff}
.nav a.active::before{content:"";position:absolute;left:-14px;top:7px;bottom:7px;width:3px;background:var(--gold);border-radius:0 3px 3px 0}
.nav a.active svg{opacity:1;color:var(--gold-soft)}
.side-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.45);flex-shrink:0}
.side-foot #footName{font-size:15px;color:rgba(255,255,255,.92);font-weight:600}
.side-foot b{color:rgba(255,255,255,.8);font-weight:600}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{min-height:64px;flex-shrink:0;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:16px;z-index:20}
.topbar .menu-btn{display:none}
.topbar h1{font-size:19px;font-weight:600;letter-spacing:-.3px;flex:1}
.content{padding:28px 36px;max-width:1560px;width:100%;margin:0 auto;flex:1;min-height:0;overflow-y:auto}

.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy-700)}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:#937A4A}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-ghost:hover{border-color:var(--soft);background:#FAFBFC}
.btn-sm{padding:7px 12px;font-size:12.5px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:22px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.section-head .ttl{font-size:15px;font-weight:600}
.section-head .desc{font-size:13px;color:var(--muted);margin-top:2px}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.kpi .ic svg{width:20px;height:20px}
.kpi .k-lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.2px;text-transform:uppercase}
.kpi .k-val{font-size:24px;font-weight:700;letter-spacing:-.6px;margin-top:2px;font-family:'Fraunces',serif;line-height:1.05}
.kpi .k-sub{font-size:11.5px;margin-top:4px;display:flex;align-items:center;gap:5px;font-weight:600;color:var(--soft)}
.kpi-grid.kpi5{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi-grid.kpi5 .kpi{padding:13px 13px}
.kpi-grid.kpi5 .k-val{font-size:19px}
.kpi-grid.kpi5 .k-lbl{font-size:10.5px}
.kpi-grid.kpi5 .ic{width:34px;height:34px;margin-bottom:8px}
@media(max-width:860px){.kpi-grid.kpi5{grid-template-columns:repeat(2,1fr)}}
/* com ícone: layout horizontal (ícone à esquerda), melhor uso da largura, menos espaço vazio */
.kpi:has(.ic){display:grid;grid-template-columns:44px 1fr;column-gap:15px;align-items:center;padding:15px 18px}
.kpi:has(.ic) .ic{grid-column:1;grid-row:1 / 4;align-self:center;margin-bottom:0}
.kpi:has(.ic) .k-lbl{grid-column:2;grid-row:1}
.kpi:has(.ic) .k-val{grid-column:2;grid-row:2;margin:1px 0}
.kpi:has(.ic) .k-sub{grid-column:2;grid-row:3;margin-top:2px}
.trend-up{color:var(--green)}.trend-down{color:var(--red)}
.ic-navy{background:var(--blue-bg);color:var(--navy)}.ic-gold{background:var(--amber-bg);color:var(--amber)}
.ic-green{background:var(--green-bg);color:var(--green)}.ic-red{background:var(--red-bg);color:var(--red)}

table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--soft);font-weight:600;padding:11px 13px;border-bottom:1px solid var(--line)}
tbody td{padding:12px 13px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFBFC}
/* compactação SÓ nas tabelas de dados (.scroll-x: Insumos, Estoque, CMV, Equipe…) e no DRE. Dashboard e painel admin ficam no tamanho normal */
.scroll-x thead th{padding:8px 13px}
.scroll-x tbody td,.dre-table tbody td{padding:7px 13px}
.scroll-x tbody td .input{padding:7px 10px;font-size:13px}
.scroll-x tbody td .money-inp{padding-left:30px}
.scroll-x tbody td .money-pre{font-size:12px}
.scroll-x tbody td .icon-btn{width:30px;height:30px}
.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.tag-green{background:var(--green-bg);color:var(--green)}.tag-red{background:var(--red-bg);color:var(--red)}
.tag-amber{background:var(--amber-bg);color:var(--amber)}.tag-navy{background:var(--blue-bg);color:var(--navy)}
.tag-gray{background:#EEF0F4;color:var(--muted)}.tag-gold{background:var(--amber-bg);color:var(--gold)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.icon-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;color:var(--muted)}
.icon-btn:hover{color:var(--navy);border-color:var(--soft)}
.icon-btn.del:hover{color:var(--red);border-color:var(--red);background:var(--red-bg)}
.icon-btn svg{width:15px;height:15px}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.3;margin-bottom:14px}
.empty .t{font-weight:600;color:var(--ink);font-size:15px}
.empty .d{font-size:13.5px;margin-top:5px}

.modal-overlay{position:fixed;inset:0;background:rgba(16,32,63,.45);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;z-index:500;padding:34px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:pop .18s ease}
.modal.wide{max-width:820px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:17px;font-weight:600;font-family:'Fraunces',serif}
.modal-head .x{width:32px;height:32px;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.modal-head .x:hover{background:#F0F1F5;color:var(--ink)}
.modal-body{padding:22px 26px;max-height:66vh;overflow-y:auto}
.modal-foot{padding:16px 26px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#FAFBFC;border-radius:0 0 18px 18px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field .hint{font-size:11.5px;color:var(--soft);font-weight:400;margin-left:4px}
.input,select.input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--ink);transition:.15s}
.input:focus,select.input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(29,53,115,.1)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.switch-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;margin-bottom:15px;background:#FAFBFC}
.switch{width:42px;height:24px;border-radius:14px;background:#CBD2DE;position:relative;transition:.2s;flex-shrink:0}
.switch.on{background:var(--navy)}
.switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{left:21px}

.comp-row{display:grid;grid-template-columns:24px 1fr 86px 80px 32px;gap:9px;align-items:center;margin-bottom:9px}
.comp-row .ctype{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.ctype-i{background:var(--blue-bg);color:var(--navy)}.ctype-f{background:var(--amber-bg);color:var(--gold)}
.comp-row .ccost{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.mini-del{width:32px;height:36px;border-radius:9px;border:1px solid var(--line);color:var(--soft);display:flex;align-items:center;justify-content:center}
.mini-del:hover{color:var(--red);border-color:var(--red);background:var(--red-bg)}

.calc-box{background:linear-gradient(135deg,#1D3573,#172b5e);color:#fff;border-radius:14px;padding:18px;margin-top:6px}
.calc-box .line{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.1)}
.calc-box .line:last-child{border-bottom:none}
.calc-box .line span:first-child{color:rgba(255,255,255,.72)}
.calc-box .line b{font-weight:600;font-variant-numeric:tabular-nums}
.calc-box .big b{font-size:17px;color:var(--gold-soft);font-family:'Fraunces',serif}
.chan-tabs{display:flex;gap:8px;margin:14px 0 10px}
.chan-tabs button{flex:1;padding:9px;border-radius:9px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--muted)}
.chan-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.matrix-wrap{display:grid;grid-template-columns:1fr 1fr;justify-content:start;gap:26px;align-items:start}
.matrix{position:relative;aspect-ratio:1/1;background:radial-gradient(130% 130% at 100% 0%,rgba(30,158,106,.06),transparent 46%),radial-gradient(130% 130% at 0% 100%,rgba(210,72,63,.05),transparent 46%),var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(16,31,66,.10)}
.quad{position:absolute;width:50%;height:50%;display:flex;align-items:flex-start;padding:15px 17px}
.quad .ql{font-size:12.5px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:5px}
.quad .qd{font-size:9.5px;color:var(--soft);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:3px}
.q-star{background:linear-gradient(135deg,rgba(30,158,106,.12),transparent 56%)}
.q-horse{background:linear-gradient(225deg,rgba(29,53,115,.10),transparent 56%)}
.q-puzzle{background:linear-gradient(45deg,rgba(201,137,42,.13),transparent 56%)}
.q-dog{background:linear-gradient(315deg,rgba(210,72,63,.09),transparent 56%)}
.matrix .axis-v{position:absolute;left:50%;top:7%;bottom:7%;width:0;border-left:1px dashed var(--line)}
.matrix .axis-h{position:absolute;top:50%;left:7%;right:7%;height:0;border-top:1px dashed var(--line)}
.matrix .axis-mid{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--soft);background:var(--card);padding:2px 7px;border-radius:7px;border:1px solid var(--line);font-weight:700;z-index:1}
.dot{position:absolute;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;font-family:'Fraunces',serif;color:#fff;cursor:pointer;border:2.5px solid var(--card);box-shadow:0 5px 14px rgba(16,31,66,.22);transition:.16s ease;z-index:2}
.dot:hover{transform:translate(-50%,-50%) scale(1.22);z-index:6;box-shadow:0 9px 22px rgba(16,31,66,.32)}
.axis-label{font-size:10.5px;color:var(--muted);text-align:center;margin-top:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}
.axis-label-y{position:absolute;left:-12px;top:50%;transform:rotate(-90deg) translateX(50%);transform-origin:left;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.7px;text-transform:uppercase;white-space:nowrap}
.eng-stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px 12px;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:128px}
.eng-stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.eng-stat .stat-foot{margin-top:auto;font-size:10.5px;color:var(--soft);border-top:1px solid var(--line);padding-top:7px}
.eng-rank{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:12.5px;color:#fff;flex:0 0 auto}

.dre-table .grp td{font-weight:700;background:#FAFBFC}
.dre-table .ind td:first-child{padding-left:28px;color:var(--muted)}
.dre-table .total td{font-weight:700;border-top:2px solid var(--navy);font-size:14.5px}
.bar{height:8px;border-radius:5px;background:#EEF0F4;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;border-radius:5px}

.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.chart .col .bw{width:100%;max-width:38px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart .col .b{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#2a4488,#1D3573)}
.chart .col .cl{font-size:11px;color:var(--muted);font-weight:500;text-align:center}
.chart .col .cv{font-size:10.5px;color:var(--soft);font-variant-numeric:tabular-nums}

.alert{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:11px;margin-bottom:9px;font-size:13px}
.alert svg{width:17px;height:17px;flex-shrink:0;margin-top:1px}
.alert-red{background:var(--red-bg);color:#9e342c}.alert-amber{background:var(--amber-bg);color:#8a5e1c}
.alert-green{background:var(--green-bg);color:#13633f}
.alert b{font-weight:700}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:13px 22px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);z-index:1200;display:flex;align-items:center;gap:9px;animation:pop .2s}
.toast svg{width:17px;height:17px;color:var(--gold-soft)}
.pill-filter{display:flex;gap:6px;flex-wrap:wrap}
.pill-filter button{padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;background:#fff;border:1px solid var(--line);color:var(--muted)}
.pill-filter button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.dash-pill{display:flex;flex-direction:column;gap:1px;padding:7px 14px;border:1px solid var(--line);border-radius:11px;background:#FAFBFC;min-width:96px}
.dash-pill span{font-size:10.5px;color:var(--soft);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.dash-pill b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.legend{display:flex;flex-direction:column;gap:9px}
.legend .li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:11px}
.legend .sw{width:13px;height:13px;border-radius:4px;flex-shrink:0;margin-top:2px}
.legend .li b{font-size:13px;display:block}.legend .li small{font-size:11.5px;color:var(--muted)}
.health-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.be-ring{display:flex;align-items:center;gap:18px}
.be-num{font-size:30px;font-weight:700;font-family:'Fraunces',serif;letter-spacing:-.5px}

@media(max-width:900px){
  body{height:auto;overflow:auto}
  .main{height:auto;overflow:visible}
  .content{overflow:visible}
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .topbar .menu-btn{display:flex;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);align-items:center;justify-content:center;color:var(--ink)}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .matrix-wrap{grid-template-columns:1fr}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .dash-grid{grid-template-columns:1fr!important}
  .buffet-grid{grid-template-columns:1fr!important}
  .content{padding:16px}
  .backdrop{position:fixed;inset:0;background:rgba(16,32,63,.4);z-index:40}
}
@media(max-width:560px){.kpi-grid{grid-template-columns:1fr}.comp-row{grid-template-columns:24px 1fr 70px 64px 30px}}
.hidden{display:none!important}
.scroll-x{overflow-x:auto}
/* ===== Auth / Admin (SaaS) ===== */
#authScreen{position:fixed;inset:0;z-index:300;background:#1D3573;display:flex;align-items:center;justify-content:center;padding:20px}
#authScreen .auth-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:400px;padding:34px 30px}
#authScreen .unidade-list{display:flex;flex-direction:column;gap:9px}
#authScreen .unidade-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;transition:border-color .15s,transform .05s}
#authScreen .unidade-card:hover{border-color:var(--gold);background:var(--card)}
#authScreen .unidade-card:active{transform:scale(.995)}
#authScreen .unidade-card:disabled{opacity:.5;cursor:not-allowed}
#authScreen .unidade-card .un-nome{font-weight:700;font-size:14.5px;color:var(--navy)}
#authScreen .unidade-card .un-sub{font-size:11.5px;color:var(--soft)}
#authScreen .auth-wm{font-family:'Fraunces',serif;font-size:34px;font-weight:600;color:var(--navy);text-align:center}
#authScreen .auth-by{font-size:13px;color:var(--gold);text-align:center;margin-top:-2px;margin-bottom:22px}
.cloud-banner{background:var(--gold);color:#fff;font-size:12.5px;font-weight:600;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.cloud-banner button{background:rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600}
.admin-wrap{max-width:1240px;margin:0 auto;padding:28px 36px}
.client-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);transition:.15s}
.client-card:hover{border-color:var(--gold-soft)}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

/* ===== marca + botão de tema ===== */
.brand .by{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--gold-soft);letter-spacing:0;margin-left:4px}
.theme-toggle{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;cursor:pointer}
.theme-toggle:hover{color:var(--gold);border-color:var(--gold-soft)}
.theme-toggle svg{width:18px;height:18px}
/* toolbar superior: botões alinhados, sem sobreposição */
#topActions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
/* toggle de tema ao lado da marca (sidebar navy) */
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand .theme-toggle{width:34px;height:34px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.20);color:rgba(255,255,255,.88)}
.brand .theme-toggle:hover{color:var(--gold);border-color:var(--gold-soft);background:rgba(255,255,255,.15)}

/* ===== TEMA ESCURO (mantém identidade PLL: navy + dourado) ===== */
body.dark{
  --bg:#0E1626;--card:#172139;--line:#283450;--ink:#E8EDF6;--muted:#9DA9C2;--soft:#6B7790;
  --navy:#4567A8;--navy-700:#3A5790;--navy-900:#0A1224;
  --gold:#C2A875;--gold-soft:#D6BE8C;
  --green:#36C088;--red:#E76B61;--amber:#DDA64E;
  --green-bg:rgba(54,192,136,.16);--red-bg:rgba(231,107,97,.16);--amber-bg:rgba(221,166,78,.16);--blue-bg:rgba(69,103,168,.24);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);--shadow-lg:0 16px 48px rgba(0,0,0,.55);
}
body.dark .topbar{background:rgba(16,22,38,.82)}
body.dark .input,body.dark select.input,body.dark textarea.input{background:#0F1A30;color:var(--ink);border-color:var(--line)}
body.dark .input::placeholder{color:#5C6882}
body.dark .btn-ghost{background:#1A2540;color:var(--ink);border-color:var(--line)}
body.dark .btn-ghost:hover{background:#222F4E}
body.dark .icon-btn{background:#1A2540}
body.dark .modal{background:var(--card);color:var(--ink)}
body.dark .modal-foot{background:#121B30}
body.dark .modal-head .x:hover{background:#222F4E}
body.dark .pill-filter button,body.dark .chan-tabs button{background:#1A2540;color:var(--muted);border-color:var(--line)}
body.dark .pill-filter button.on,body.dark .chan-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
body.dark .dash-pill{background:#121B30}
body.dark tbody tr:hover{background:#1B2640}
body.dark .dre-table .grp td{background:#121B30}
body.dark .tag-gray{background:#222F4E;color:var(--muted)}
body.dark .bar{background:#222F4E}
body.dark .switch{background:#3A4660}
body.dark .chart .col .b{background:linear-gradient(180deg,#5B7BC4,#42619F)}
body.dark .theme-toggle{background:#1A2540}
body.dark .empty svg{opacity:.4}

.print-only{display:none}
@media print{
  body,body.dark{--bg:#fff;--card:#fff;--ink:#15191f;--muted:#555;--soft:#888;--line:#cccccc;background:#fff!important;color:#15191f!important}
  .sidebar,.topbar,.no-print,#toastRoot,#modalRoot,.backdrop,.tabbar,#taBackdrop{display:none!important}
  body{display:block;background:#fff}
  .main{display:block}
  .content{padding:8mm 12mm!important;max-width:none!important;margin:0!important}
  .card{box-shadow:none!important;border:1px solid #ccc;break-inside:avoid}
  .print-only{display:block!important}
  table{font-size:12px}
  a[href]:after{content:''}
}
/* =====================================================================
   UX v2, polimento premium (gradientes navy→dourado, micro-interações)
   ===================================================================== */

/* fundo com profundidade sutil */
body{background:radial-gradient(1100px 520px at 85% -10%, rgba(29,53,115,.06), transparent 60%), var(--bg)}
body.dark{background:radial-gradient(1100px 520px at 85% -10%, rgba(164,138,87,.07), transparent 60%), var(--bg)}
::selection{background:rgba(164,138,87,.32)}

/* scrollbar discreta e themeada */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C7CEDC;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#AEB8CC;border:2px solid transparent;background-clip:content-box}
body.dark ::-webkit-scrollbar-thumb{background:#33415F;border:2px solid transparent;background-clip:content-box}

/* sidebar: navy com profundidade + marca em gradiente */
.sidebar{background:linear-gradient(180deg,#234180 0%,#1D3573 52%,#16294F 100%)}
.brand .wm{background:linear-gradient(120deg,#FFFFFF 35%,var(--gold-soft));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand .by{-webkit-text-fill-color:var(--gold-soft)}
.nav .lbl{color:rgba(214,190,140,.55)}
.nav a.active{background:linear-gradient(90deg,rgba(255,255,255,.17),rgba(255,255,255,.05))}

/* topbar com fio dourado */
.topbar{position:relative}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--gold) 0%,rgba(164,138,87,.25) 35%,transparent 70%);pointer-events:none}

/* botões: gradiente + elevação */
.btn{transition:transform .16s ease, box-shadow .16s ease, background .16s ease, border-color .16s ease}
.btn:active{transform:translateY(0) scale(.97)}
.btn-primary{background:linear-gradient(135deg,#2B4C99 0%,#1D3573 100%);box-shadow:0 2px 10px rgba(29,53,115,.28)}
.btn-primary:hover{background:linear-gradient(135deg,#33549F 0%,#24408A 100%);transform:translateY(-1px);box-shadow:0 6px 16px rgba(29,53,115,.36)}
.btn-gold{background:linear-gradient(135deg,#C8AE7B 0%,#A48A57 100%);box-shadow:0 2px 10px rgba(164,138,87,.32)}
.btn-gold:hover{background:linear-gradient(135deg,#CDB484 0%,#94793F 100%);transform:translateY(-1px);box-shadow:0 6px 16px rgba(164,138,87,.4)}
body.dark .btn-primary{background:linear-gradient(135deg,#54719F 0%,#3A5790 100%)}
body.dark .btn-primary:hover{background:linear-gradient(135deg,#5F7DAD 0%,#44639E 100%)}

/* KPIs e cards de cliente: vida no hover + filete de valor */
.kpi,.client-card{transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;position:relative;overflow:hidden}
.kpi:hover,.client-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--gold-soft)}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--navy),var(--gold));opacity:0;transition:opacity .2s}
.kpi:hover::after{opacity:1}
.client-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--navy),var(--gold))}

/* HERO do dashboard: navy premium com brilho dourado */
.hero-card{background:linear-gradient(135deg,#24417F 0%,#1D3573 55%,#16294F 100%);border:none;color:#fff;position:relative;overflow:hidden}
.hero-card::after{content:'';position:absolute;top:-60px;right:-40px;width:340px;height:220px;background:radial-gradient(closest-side,rgba(194,168,117,.28),transparent);pointer-events:none}
.hero-card .hero-sub{font-size:13px;color:rgba(255,255,255,.72)}
.hero-card .dash-pill{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18)}
.hero-card .dash-pill span{color:rgba(255,255,255,.62)}
.hero-card .dash-pill b{color:#fff}
body.dark .hero-card{background:linear-gradient(135deg,#22386B 0%,#16244A 60%,#0E1934 100%)}
@media print{.hero-card{background:#fff!important;color:#15191f!important;border:1px solid #ccc!important}.hero-card .hero-sub{color:#555!important}}

/* tela de login: fundo premium + cartão com assinatura dourada */
#authScreen{background:radial-gradient(900px 520px at 72% -8%, rgba(194,168,117,.25), transparent 55%), linear-gradient(160deg,#27457f 0%,#1D3573 52%,#101F42 100%)}
#authScreen .auth-card{border-top:4px solid var(--gold);box-shadow:0 24px 70px rgba(5,12,30,.45)}
#authScreen .auth-wm{background:linear-gradient(120deg,var(--navy),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* alertas legíveis no tema escuro */
body.dark .alert-green{color:#8FDDBA}
body.dark .alert-amber{color:#EBC98B}
body.dark .alert-red{color:#F2A8A1}

/* input de moeda com R$ na frente */
.money-wrap{position:relative}
.money-wrap .money-pre{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--soft);font-weight:600;font-size:13px;pointer-events:none}
.money-wrap .money-inp{padding-left:36px;text-align:left}

/* campos numéricos sem as setinhas (spinner) */
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}

/* botão editar dados (rodapé sidebar) */
.side-edit{display:block;width:100%;text-align:left;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.92);font-size:12.5px;font-weight:600;padding:9px 11px;border-radius:9px;cursor:pointer;margin-bottom:12px;transition:.15s}
.side-edit:hover{background:rgba(194,168,117,.22);border-color:var(--gold-soft);color:#fff}

/* WIZARD / ANAMNESE */
#wizScreen{position:fixed;inset:0;z-index:400;display:flex;flex-direction:column;background:radial-gradient(900px 520px at 78% -10%,rgba(194,168,117,.20),transparent 55%),linear-gradient(160deg,#27457f 0%,#1D3573 52%,#101F42 100%);overflow:auto}
.wiz-top{display:flex;align-items:center;gap:16px;padding:18px 28px;color:#fff}
.wiz-top .wm{font-family:'Fraunces',serif;font-size:22px;font-weight:600}
.wiz-top .wm .by{font-family:'Inter',sans-serif;font-size:12px;color:var(--gold-soft);margin-left:4px}
.wiz-step-lbl{margin-left:auto;font-size:12.5px;color:rgba(255,255,255,.8);font-weight:600;letter-spacing:.4px}
.wiz-prog{height:5px;background:rgba(255,255,255,.14);margin:0 28px;border-radius:99px;overflow:hidden}
.wiz-prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#E7D3A8);border-radius:99px;transition:width .3s}
.wiz-grupo{padding:6px 28px 0;color:var(--gold-soft);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.wiz-body{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:18px 28px 30px}
.wiz-card{width:100%;max-width:920px;background:var(--card);border-radius:18px;box-shadow:0 24px 70px rgba(5,12,30,.45);border-top:4px solid var(--gold);overflow:hidden;display:grid;grid-template-columns:300px 1fr}
.wiz-ctx{background:linear-gradient(160deg,#24417F,#16294F);color:#fff;padding:26px 24px}
.wiz-ctx .tag{font-size:11px;letter-spacing:1.5px;color:var(--gold-soft);font-weight:700}
.wiz-ctx h2{font-family:'Fraunces',serif;font-size:23px;font-weight:600;margin:8px 0 10px;line-height:1.15}
.wiz-ctx p{font-size:13.5px;color:rgba(255,255,255,.8);line-height:1.55}
.wiz-resp{padding:26px 26px 22px}
.wiz-resp .resp-lbl{font-size:11px;letter-spacing:1.4px;color:var(--soft);font-weight:700;text-transform:uppercase;margin-bottom:14px}
.wiz-foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:16px 26px;background:var(--bg)}
.wiz-foot .spacer{flex:1}
.wiz-sub{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;position:relative;background:var(--card)}
.wiz-sub .sub-h{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.wiz-sub .mini-del{position:absolute;top:10px;right:10px}
.wiz-calc{background:var(--amber-bg);border:1px solid var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:6px}
.wiz-seg{display:flex;gap:8px;flex-wrap:wrap}
.wiz-seg button{flex:1;min-width:90px;padding:11px 10px;border:1px solid var(--line);border-radius:11px;background:var(--card);font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;transition:.15s}
.wiz-seg button.on{background:linear-gradient(135deg,#2B4C99,#1D3573);color:#fff;border-color:transparent}
@media(max-width:720px){.wiz-card{grid-template-columns:1fr}.wiz-ctx{padding:20px}}
body.dark .wiz-foot{background:#0E1626}

/* folha de contagem de estoque (impressão em 2 colunas) */
#printArea{display:none}

.modal.fichamodal{max-width:1020px;overflow:hidden}
.ficha-split{display:flex;align-items:stretch;min-height:560px}

.ins-card.edit{flex-direction:column;align-items:stretch;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}

.ins-rm{color:var(--red);font-size:12px;font-weight:600;background:var(--red-bg);border-radius:8px;padding:7px 11px;cursor:pointer;flex-shrink:0}

.ins-add .plus{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--soft);flex-shrink:0}

/* ===== Impressão da ficha técnica ===== */
@media print{
  @page fichap{size:A4 portrait;margin:0}
  body.print-ficha .sidebar,body.print-ficha .main,body.print-ficha #modalRoot,body.print-ficha #toastRoot,body.print-ficha .tabbar,body.print-ficha #taBackdrop{display:none!important}
  body.print-ficha #printArea{display:block!important;padding:0;page:fichap}
  /* espaçadores que repetem em toda página impressa: dão margem superior/inferior sem devolver o cabeçalho/rodapé do navegador */
  #printArea .fp-page{width:100%;border-collapse:collapse}
  #printArea .fp-page>thead>tr>td,#printArea .fp-page>tfoot>tr>td{height:13mm;border:0;padding:0}
  #printArea .fp-page>tbody>tr>td{padding:0 12mm;border:0;vertical-align:top}
  #printArea .fp{color:#000;font-family:'Inter',sans-serif;border:1.5px solid #000}
  #printArea .fp-title{font-weight:800;font-size:15px;padding:8px 12px;border-bottom:1.5px solid #000}
  #printArea .fp-meta{font-size:11px;padding:6px 12px;border-bottom:1.5px solid #000;display:flex;flex-wrap:wrap;gap:4px 18px}
  #printArea .fp-sec{font-weight:800;font-size:11px;text-transform:uppercase;text-align:center;background:#eaeaea;padding:5px;border-bottom:1px solid #000;border-top:1px solid #000;letter-spacing:.4px}
  #printArea .fp-row{display:flex;border-bottom:1.5px solid #000}
  #printArea .fp-foto{width:200px;flex-shrink:0;border-right:1px solid #000;display:flex;align-items:center;justify-content:center;color:#666;font-size:11px;font-weight:700;text-align:center;min-height:120px}
  #printArea .fp-foto img{width:100%;height:100%;max-height:170px;object-fit:cover}
  #printArea .fp-ing{flex:1}
  #printArea table.fp-tb{width:100%;border-collapse:collapse}
  #printArea table.fp-tb th{font-size:10.5px;text-transform:none;text-align:left;background:#f3f3f3;border:1px solid #999;padding:4px 7px;color:#000;letter-spacing:0}
  #printArea table.fp-tb td{font-size:11px;border:1px solid #999;padding:4px 7px;color:#000}
  #printArea .fp-steps{padding:7px 14px;font-size:11.5px}
  #printArea .fp-steps div{padding:2px 0}
  #printArea .fp-final{padding:7px 14px;font-size:11.5px;min-height:34px}
  #printArea .fp-final.empty{color:#777;font-style:italic}
  #printArea .fp-onb{display:flex}
  #printArea .fp-onb .ob{flex:1;border-right:1px solid #000;padding:8px 6px 22px;text-align:center}
  #printArea .fp-onb .ob:last-child{border-right:0}
  #printArea .fp-onb .ob b{font-size:10px;display:block}
  #printArea .fp-onb .ob small{font-size:9px;color:#444;display:block;margin-top:2px}
  #printArea .fp-onb .ob .ln{border-top:1px solid #000;width:60%;margin:14px auto 0}
}

/* ===== Impressão da planilha de desperdícios ===== */


/* cabeçalho de tabela clicável (ordenação) */
.th-sort{cursor:pointer;user-select:none;white-space:nowrap}
.cat-chip{display:inline-flex;align-items:center;gap:5px;background:#EEF0F4;border-radius:8px;padding:4px 6px 4px 10px;font-size:12.5px;color:var(--ink)}
body.dark .cat-chip{background:#222F4E}
.cat-chip button{display:inline-flex;width:16px;height:16px;border-radius:5px;align-items:center;justify-content:center;color:var(--soft)}
.cat-chip button:hover{background:var(--red-bg);color:var(--red)}
.cat-chip svg{width:11px;height:11px}
.lanc-filtro th{padding:4px 6px!important;border-bottom:1px solid var(--line)}
.lanc-filtro .input{height:30px;padding:4px 8px;font-size:12px;width:100%;min-width:80px}
.th-sort:hover{color:var(--gold)}

/* cards de fichas técnicas */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;transition:.15s}
.fcard:hover{border-color:var(--gold-soft);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.fcard-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.fcard-ic{width:38px;height:38px;border-radius:10px;background:var(--amber-bg);color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fcard-ic svg{width:20px;height:20px}
.fcard-nm{font-weight:700;font-size:15px;line-height:1.15}
.fcard-sub{font-size:11.5px;color:var(--soft);margin-top:3px}
.fcard-badge{margin-left:auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;flex-shrink:0}
.fcard-acts{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted);padding:9px 0;border-bottom:1px solid var(--line);margin-bottom:9px;flex-wrap:wrap}
.fcard-acts button,.fcard-acts a{color:var(--muted);background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:0}
.fcard-acts svg{width:13px;height:13px}
.fcard-acts button:hover,.fcard-acts a:hover{color:var(--gold)}
.fcard-acts .edit{margin-left:auto;color:var(--navy);font-weight:600}
body.dark .fcard-acts .edit{color:#9DB4E8}
.frow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.frow .l{color:var(--muted)}
.frow.div{border-top:1px solid var(--line);margin-top:6px;padding-top:9px}

/* ficha modular */
.mod-cost{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.mod-cost>div{border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.mod-cost .l{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700}
.mod-cost .v{font-size:18px;font-weight:700;font-family:'Fraunces',serif;margin-top:3px}
.mod-box{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.mod-box-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mod-opt-h{display:grid;grid-template-columns:26px 1fr 190px 34px 28px;gap:8px;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 2px 4px}
.mod-opt{display:grid;grid-template-columns:26px 1fr 190px 34px 28px;gap:8px;align-items:center;margin-bottom:7px}
.mod-opt .lk{border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;color:var(--muted);height:38px;display:flex;align-items:center;justify-content:center}
.mod-opt .lk svg{width:15px;height:15px}
.mod-opt .lk.on{background:var(--amber-bg);color:var(--gold);border-color:var(--gold-soft)}
.mod-add{width:100%;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--muted);padding:9px;cursor:pointer;font-size:13px;font-weight:600}
.mod-add:hover{border-color:var(--gold-soft);color:var(--gold)}

/* gerenciar categorias */
.cat-scroll{max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:7px}
.cat-row{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.cat-row.cat-pad{background:var(--amber-bg);border-color:var(--gold-soft)}
.cat-row.cat-pad>span{color:var(--gold);font-weight:600}
.cat-badge{font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-left:6px}

/* tabelas e modais: toques finos */
thead th{letter-spacing:.7px}
.modal{border-top:4px solid var(--gold)}
.calc-box{background:linear-gradient(135deg,#24417F,#16294F)}
.cloud-banner{background:linear-gradient(90deg,#A48A57,#8d743f)}
@keyframes lmspin{to{transform:rotate(360deg)}}
.lm-spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--navy);animation:lmspin .8s linear infinite}

/* grades: o filho não pode ditar a largura do container (senão a página estoura no celular) */
.dash-grid, .dash-grid > *{min-width:0}
.card.card-pad{min-width:0}

/* =====================================================================
   CELULAR (<=760px). A maioria dos donos usa o app no telefone.
   ===================================================================== */
.tabbar{display:none}
.ta-mais{display:none}
@media(max-width:760px){
  /* navegação: barra inferior no lugar da gaveta */
  .tabbar{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
    border-top:1px solid var(--line);box-shadow:0 -2px 14px rgba(16,32,63,.07);
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:none;border:0;padding:9px 2px 8px;color:var(--soft);font-size:10px;font-weight:700;
    letter-spacing:.2px;cursor:pointer;min-height:58px;font-family:inherit}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button.on{color:var(--navy)}
  body.dark .tabbar button.on{color:var(--gold)}
  .topbar .menu-btn{display:none!important}
  .sidebar{display:none}
  .backdrop{display:none!important}
  .content{padding:14px 14px 92px}
  .topbar{padding:0 14px;gap:10px;min-height:58px}
  .topbar h1{font-size:17px}

  /* ações: só a principal fica visível, o resto entra no "mais" */
  .ta-mais{display:block;position:relative}
  #topActions{gap:8px;flex-wrap:nowrap}
  #topActions>.btn:first-child{white-space:nowrap}
  .ta-btn{width:44px;min-width:44px;padding:0;display:flex;align-items:center;justify-content:center}
  .ta-btn svg{width:20px;height:20px}
  .ta-sheet{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:70;background:var(--card);
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;
    min-width:232px;max-width:min(300px,calc(100vw - 28px));flex-direction:column;gap:6px}
  .ta-sheet.open{display:flex}
  .ta-sheet>*{width:100%;justify-content:flex-start!important;text-align:left;min-height:44px}
  .ta-backdrop{position:fixed;inset:0;z-index:65;display:none}
  .ta-backdrop.on{display:block}

  /* alvos de toque: 30px não se acerta com o dedo */
  .btn{min-height:44px}
  .btn-sm{min-height:38px}
  .icon-btn{width:40px;height:40px}
  .row-actions{gap:8px}
  .mini-del,.cat-row .mini-del{min-width:36px;min-height:36px}
  /* 16px no campo evita o zoom automático do iOS ao focar */
  .input,select.input,textarea.input{min-height:46px;font-size:16px}
  .money-inp{font-size:16px}
  .pill-filter button,.chan-tabs button{min-height:40px}

  /* legibilidade: nada de 9px na mão do cliente */
  .hint{font-size:12px}
  .desc{font-size:12.5px}

  /* Produtos vira lista de cartão */
  .prod-list{display:flex;flex-direction:column}
  .prod-item{padding:13px 14px;border-bottom:1px solid var(--line)}
  .prod-item:last-child{border-bottom:0}
  .prod-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .prod-nm{font-size:14.5px;font-weight:600;line-height:1.25}
  .prod-sub{font-size:12px;color:var(--soft);margin-top:2px}
  .prod-nums{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:9px;
    font-size:12.5px;color:var(--muted)}
  .prod-nums b{color:var(--ink);font-weight:600}
  .prod-custo{font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:var(--navy);white-space:nowrap}
  .prod-custo i{font-style:normal;font-size:11.5px;color:var(--soft);font-family:'Inter',sans-serif;font-weight:500}
  body.dark .prod-custo{color:var(--gold)}

  /* marmitas: um cartão por linha, sem as duas linhas de detalhe */
  .fgrid{grid-template-columns:1fr;gap:12px}
  .fcard{padding:14px 14px 12px}
  .fcard .frow.so-desktop{display:none}
  .fcard-acts{gap:10px}
  .fcard-acts button,.fcard-acts a{min-height:36px;display:inline-flex;align-items:center}

  /* modal vira folha: cabeçalho e rodapé fixos, miolo rola */
  .modal-overlay{padding:0;align-items:flex-end;overflow:hidden}
  .modal{max-width:none;border-radius:18px 18px 0 0;max-height:94vh;display:flex;flex-direction:column;
    overflow:hidden;animation:sobe .22s ease}
  .modal-head{position:sticky;top:0;z-index:3;background:var(--card);padding:16px 18px}
  .modal-head h3{font-size:16px}
  .modal-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;padding:16px 18px}
  .ficha-split{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto}
  .modal-foot{position:sticky;bottom:0;z-index:3;border-radius:0;padding:12px 18px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));flex-wrap:wrap}
  .modal-foot .btn{flex:1 1 auto}
  @keyframes sobe{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}

  /* tabelas que sobram vão para rolagem lateral com aviso de largura */
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
}
@media(max-width:400px){
  .tabbar button{font-size:9.5px}
  .tabbar button svg{width:20px;height:20px}
}


@media(max-width:760px){
  /* painel: quatro números em 2x2, não em coluna */
  .kpi-mob{grid-template-columns:1fr 1fr!important;gap:10px!important}
  .kpi-mob>.card{padding:12px 13px}
  .kpi-mob>.card>div:nth-child(2){font-size:21px!important}
  .hero-card{padding:16px}
  .hero-card .dash-pill{padding:7px 10px}
  .dash-grid{gap:14px!important}

  /* cartão da marmita mais enxuto */
  .fcard .frow{padding:4px 0;font-size:13px}
  .fcard-nm{font-size:14.5px}
  .fcard-sub{font-size:11.5px}
  .fcard-top{margin-bottom:8px}

  /* engenharia: rótulos minúsculos ficam legíveis */
  .legend small,.eng-quad,.matrix-wrap small{font-size:11px!important}
}


@media(max-width:760px){
  /* Precificação: o preço vem antes do formulário. É o que o dono quer ver. */
  #precResultado{order:-1}
  /* Engenharia: o texto de apoio não pode comer meia tela */
  .eng-h1,.matrix-wrap h2{font-size:20px!important}
  .eng-intro{font-size:12.5px!important}
}


@media(max-width:760px){
  .fichamodal{display:flex;flex-direction:column;max-height:94vh}
  .fichamodal>.fx-head{position:sticky;top:0;z-index:3;background:var(--card);flex:0 0 auto;
    padding:16px 18px 10px;border-bottom:1px solid var(--line)}
  .fichamodal>.ficha-split{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
  .fichamodal>.fx-foot{flex:0 0 auto;position:sticky;bottom:0;z-index:3;background:var(--card);
    border-radius:0;padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom));flex-wrap:wrap}
  .fichamodal>.fx-foot .btn{flex:1 1 auto}
  /* dados da marmita primeiro, lista de produtos depois */
  .fichamodal .fx-right{order:1}
  .fichamodal .fx-left{order:2;border-top:1px solid var(--line)}
  /* uma rolagem só: nada de área rolável dentro de área rolável no toque */
  .fichamodal .fx-left-body,.fichamodal .fx-right-body{max-height:none;overflow:visible;padding:16px 18px}
  .fichamodal .ficha-split{min-height:0}
  .fichamodal .chan-tabs{margin:12px 18px 0}
}

</style>

<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-row">
      <div class="wm serif">Marmita <span class="by">Lucrativa</span></div>
      <button id="themeBtn" class="theme-toggle" title="Alternar tema claro/escuro" onclick="toggleTheme()"></button>
    </div>
  </div>
  <nav class="nav" id="nav">
    <div class="lbl">CARDÁPIO</div>
    <a data-route="dashboard" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Painel</a>
    <a data-route="insumos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h12"/></svg>Produtos</a>
    <a data-route="fichas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h16l-1.2 11a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8L4 8z"/><path d="M4 8l1.6-3.2A2 2 0 0 1 7.4 3.6h9.2a2 2 0 0 1 1.8 1.2L20 8"/><path d="M9.5 8v12M14.5 8v12"/></svg>Marmitas</a>
    <div class="lbl">PREÇO</div>
    <a data-route="precificacao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Precificação</a>
    <a data-route="engenharia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-6"/></svg>Engenharia de Cardápio</a>
    <div class="lbl">SUA CONTA</div>
    <a data-route="conta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Configurações</a>

    <b id="footName">Seu Restaurante</b>

<div class="main">

    <button class="menu-btn" onclick="toggleSidebar(true)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <h1 id="pageTitle">Dashboard</h1>
    <div id="saveStatus" style="display:none;align-items:center;gap:5px;font-size:12px;font-weight:600;margin-left:auto;margin-right:10px;white-space:nowrap"></div>
    <div id="topActions"></div>
  </header>
  <main class="content" id="view"></main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============================================================
   LIDERA GESTÃO v2, gestão financeira p/ restaurante
   Precificação consciente por canal · Programa Lucro e Liberdade
   ============================================================ */
const STORE_KEY='marmita_lucrativa_v1';
const fmtBRL=v=>(isFinite(v)?v:0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtN=(v,d=0)=>(isFinite(v)?v:0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtPct=v=>fmtN(isFinite(v)?v:0,1)+'%';
/* máscara de moeda nos inputs: R$ na frente + milhar/decimal */
const fmtMoneyInput=n=>(isFinite(n)?n:0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function moneyMask(el){let d=(el.value||'').replace(/\D/g,'');if(d==='')d='0';const v=parseInt(d,10)/100;el.value=fmtMoneyInput(v);return v;}
function moneyVal(id){const el=document.getElementById(id);if(!el)return 0;return parseFloat((el.value||'0').replace(/\./g,'').replace(',','.'))||0;}
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const UNIDADES=['g','ml','un','kg','L'];                       // 5 unidades oficiais
const BASE={kg:'g',g:'g',L:'ml',ml:'ml',un:'un'};
const TO_BASE={kg:1000,g:1,L:1000,ml:1,un:1};
const USYM={g:'gr',ml:'ml',un:'un',kg:'kg',L:'lt'};           // símbolo da unidade de compra
const BSYM={g:'gr',ml:'ml',un:'un'};                          // símbolo da unidade-base
const ULABEL={g:'Gramas (gr)',ml:'Mililitros (ml)',un:'Unidade (un)',kg:'Quilogramas (kg)',L:'Litros (lt)'};
function uSym(u){return USYM[u]||u;}
function bSym(u){return BSYM[BASE[u]]||BASE[u]||'';}
const DEF_CAT_INSUMO=['Proteínas','Laticínios','Grãos','Legumes','Hortifruti','Molhos','Temperos','Óleos','Vinhos','Bebidas','Padaria','Congelados','Mercearia','Embalagens'];
const DEF_CAT_PRATO=['Prato Principal','Entrada','Acompanhamento','Sobremesa','Drinks, Coquetéis e Sucos','Lanches'];
const CAT_INSUMO=DEF_CAT_INSUMO, CAT_FICHA=DEF_CAT_PRATO;     // aliases (compat.)
function dbCats(){DB.cats=DB.cats||{insumo:[],prato:[]};DB.cats.insumo=DB.cats.insumo||[];DB.cats.prato=DB.cats.prato||[];return DB.cats;}
const ordPt=arr=>(arr||[]).slice().sort((a,b)=>(''+a).localeCompare((''+b),'pt',{sensitivity:'base'}));
function catList(t){const def=t==='prato'?DEF_CAT_PRATO:DEF_CAT_INSUMO;const cst=dbCats()[t]||[];return ordPt([...def,...cst.filter(c=>!def.includes(c))]);}
function isCatPadrao(t,c){return (t==='prato'?DEF_CAT_PRATO:DEF_CAT_INSUMO).includes(c);}
function subOptionsCMV(sel){nfeEnsureCats();const subs=ordPt(((DB.categorias['CMV']||{subs:[]}).subs)||[]);if(sel&&!subs.includes(sel))subs.unshift(sel);return `<option value="">Escolha a subcategoria</option>`+subs.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');}
function catOptions(t,sel){const list=catList(t).slice();if(sel&&!list.includes(sel))list.unshift(sel);return `<option value="">Escolha a categoria</option>`+list.map(c=>`<option ${c===sel?'selected':''}>${esc(c)}</option>`).join('');}
function fornOptions(sel){const fs=(DB.fin&&DB.fin.fornecedores)||[];let names=fs.map(f=>f.nome).filter(Boolean);if(sel&&!names.includes(sel))names.push(sel);names=ordPt(names);return `<option value="">Sem fornecedor</option>`+names.map(nm=>`<option ${nm===sel?'selected':''}>${esc(nm)}</option>`).join('');}
function fornDatalist(){return `<datalist id="forn_dl">${((DB.fin&&DB.fin.fornecedores)||[]).map(f=>`<option value="${esc(f.nome)}"></option>`).join('')}</datalist>`;}
function ensureFornecedor(nome){nome=(nome||'').trim();if(!nome)return;DB.fin=DB.fin||{};DB.fin.fornecedores=DB.fin.fornecedores||[];if(!DB.fin.fornecedores.some(f=>(f.nome||'').toLowerCase()===nome.toLowerCase()))DB.fin.fornecedores.push({id:uid(),nome,contato:''});}

let DB=load();
function load(){try{const d=JSON.parse(localStorage.getItem(STORE_KEY));if(d&&d.insumos)return d;}catch(e){}return seed();}
function save(){if(typeof CLOUD!=='undefined'&&CLOUD){pushCloud();renderFoot();return;}try{localStorage.setItem(STORE_KEY,JSON.stringify(DB));}catch(e){if(window.toast)toast('Não foi possível salvar (armazenamento cheio ou bloqueado)');}renderFoot();}
async function saveNow(){clearTimeout(window._cloudT);renderFoot();
  if(typeof CLOUD!=='undefined'&&CLOUD&&typeof sb!=='undefined'&&sb&&typeof ORG!=='undefined'&&ORG){
    try{localStorage.setItem(localBackupKey(),JSON.stringify({dados:DB,ts:Date.now()}));}catch(e){}
    if(CLOUD_CONFLICT){setSaveStatus('conflict');avisarConflito();return false;}
    setSaveStatus('saving');_mergeHouve=false;
    const r=await cloudCommit();
    if(r==='saved'){try{localStorage.removeItem(localBackupKey());}catch(e){}setSaveStatus('saved');if(_mergeHouve)toast('Alterações de outra pessoa foram mescladas');return true;}
    if(r==='error'){setSaveStatus('error');scheduleRetry();return false;}
    CLOUD_CONFLICT=true;setSaveStatus('conflict');avisarConflito();return false;
  }
  try{localStorage.setItem(STORE_KEY,JSON.stringify(DB));}catch(e){}
  return true;}
function seed(){return dadosExemplo();}

/* ===================== MOTOR DE CÁLCULO ===================== */
function custoInsumoBase(ins,_seen){ // custo por 1 unidade-base (g/ml/un) do insumo
  if(!ins) return 0;
  if(ins.tipo==='preparado'){ // sub-receita: soma dos ingredientes ÷ rendimento
    _seen=_seen||new Set(); if(_seen.has(ins.id)) return 0; _seen.add(ins.id); // anti-ciclo
    let total=0;(ins.comps||[]).forEach(([cid,q])=>{const c=DB.insumos[cid];if(c)total+=custoInsumoBase(c,_seen)*(q||0);});
    const baseQty=(ins.rendimento||1)*(TO_BASE[ins.uni]||1);
    return baseQty? total/baseQty : 0;
  }
  const totalBase=(ins.qtd||1)*(TO_BASE[ins.uni]||1);
  return totalBase? ins.preco/totalBase : 0;
}
function custoFicha(ficha){ // soma dos insumos da ficha (sem embalagem)
  return (ficha.comps||[]).reduce((s,c)=>{const ins=DB.insumos[c[0]];return s+(ins?custoInsumoBase(ins)*(c[1]||0):0);},0);
}
function custoProduto(ficha){ // custo por porção vendida = insumos/porção + embalagem
  return custoFicha(ficha)/(ficha.porcoes||1)+(ficha.custoEmbalagem||0);
}
function pesoFichaKg(ficha){ // peso total da receita em Kg (insumos de massa/volume)
  let g=0;(ficha.comps||[]).forEach(([id,q])=>{const ins=DB.insumos[id];if(!ins)return;const b=BASE[ins.uni];if(b==='g'||b==='ml')g+=(q||0);});
  return g/1000;
}
function custoPorKgFicha(ficha){ // custo de 1 Kg do prato pronto
  const kg=pesoFichaKg(ficha), ct=custoFicha(ficha);
  return kg>0? ct/kg : custoProduto(ficha);
}
function impostoVarPct(){return DB.fin.mei?0:(DB.fin.aliquota||0);}
function impostoMensal(fat){return DB.fin.mei?(DB.fin.impostoFixo||0):fat*((DB.fin.aliquota||0)/100);}
function regimeLabel(){if(DB.fin.mei)return 'MEI / DAS';return DB.fin.regime==='presumido'?'Lucro Presumido':DB.fin.regime==='lucroReal'?'Lucro Real':'Simples Nacional';}
/* ===== CANAIS DE VENDA (delivery / marketplace) =====
   Cada canal tem um id interno FIXO e um nome que é só rótulo. É o id que amarra o
   preço dentro da ficha (ficha.precos[id]), então renomear "iFood" para o delivery
   da cidade nos Parâmetros não desliga nada: as fichas continuam apontando pro mesmo
   canal. O balcão não é um canal — é o que sobra do mix (100 − soma dos deliveries). */
const CANAIS_MAX=3;
function canaisVenda(){const f=(DB&&DB.fin)||{};return Array.isArray(f.canais)?f.canais.filter(c=>c&&c.id):[];}
function canalPorId(id){return canaisVenda().find(c=>c.id===id)||null;}
function canalMix(c){return clamp(+(c&&c.mix)||0,0,100);}
function canalTaxa(c){return Math.max(0,+(c&&c.taxa)||0);}
function mixDelivery(){return clamp(canaisVenda().reduce((s,c)=>s+canalMix(c),0),0,100);}
function mixBalcao(){return 100-mixDelivery();}
function precoDoCanal(ficha,c){const v=+(((ficha&&ficha.precos)||{})[c.id])||0;return v>0?v:(+(ficha&&ficha.precoVenda)||0);}
function metricasCanal(ficha,canal){ // canal: 'balcao' | id de um canal de venda
  const custo=custoProduto(ficha);
  const c=(canal&&canal!=='balcao')?canalPorId(canal):null;
  const preco = c ? precoDoCanal(ficha,c) : (ficha.precoVenda||0);
  const comissao = c ? canalTaxa(c) : 0;
  const descPct=(comissao+impostoVarPct())/100;
  const mc = preco - custo - preco*descPct;       // margem de contribuição R$
  const mcPct = preco? mc/preco*100 : 0;
  const precoLiq = preco*(1-comissao/100);        // líquido após a comissão do canal
  const cmv = precoLiq>0? custo/precoLiq*100 : 0; // CMV sobre o líquido recebido
  return {preco,custo,comissaoPct:comissao,impostoPct:impostoVarPct(),mc,mcPct,cmv,markup:custo?preco/custo:0,canal:c||null};
}
function metricasFicha(ficha){ // mistura balcão + cada canal, ponderando pelo mix de cada um
  const cs=canaisVenda();
  const b=metricasCanal(ficha,'balcao');
  const porCanal=cs.map(c=>({canal:c,peso:canalMix(c)/100,m:metricasCanal(ficha,c.id)}));
  const partes=[{peso:mixBalcao()/100,m:b}].concat(porCanal);
  const precoBlend=partes.reduce((s,x)=>s+x.m.preco*x.peso,0);
  const mcBlend=partes.reduce((s,x)=>s+x.m.mc*x.peso,0);
  const cmvBlend=precoBlend?(b.custo/precoBlend*100):0;
  const vendas=ficha.vendasMes||0;
  // 'ifood' = 1º canal; mantido para telas que olham um canal de delivery só
  const primeiro=porCanal.length?porCanal[0].m:b;
  return {balcao:b,ifood:primeiro,canais:porCanal,custo:b.custo,precoBlend,mcBlend,cmvBlend,
    mcPctBlend:precoBlend?mcBlend/precoBlend*100:0,vendas,
    receita:precoBlend*vendas, mcTotal:mcBlend*vendas,
    health: healthFicha(b.cmv)};
}

function cmvUpRef(){return cmvAlvoRef()+5;}
function cmvClasse(v){const a=cmvAlvoRef();return v<=a?'excelente':(v<=cmvUpRef()?'atencao':'critico');}
function cmvCorRef(v){const c=cmvClasse(v);return c==='excelente'?'var(--green)':c==='atencao'?'var(--amber)':'var(--red)';}

  if(p==='ult3'){let sm=m-2,sy=y;if(sm<0){sm+=12;sy--;}return{de:iso(sy,sm,1),ate:iso(y,m,ld(y,m)),label:'Últimos 3 meses',nm:3};}
  if(p==='ano')return{de:iso(y,0,1),ate:iso(y,m,ld(y,m)),label:'Este ano ('+y+')',nm:m+1};
  if(p==='anoAnterior')return{de:iso(y-1,0,1),ate:iso(y-1,11,31),label:'Ano anterior ('+(y-1)+')',nm:12};

  return{de:iso(y,m,1),ate:iso(y,m,ld(y,m)),label:'Mês atual',nm:1};}
function setPeriodo(v){periodo=v;if(v==='custom'&&!periodoCustom.de){const r=periodoRange('mesAtual');periodoCustom={de:r.de,ate:r.ate};}ROUTES[current].render();}
function setPeriodoCustom(k,v){periodoCustom[k]=v;periodo='custom';if(periodoCustom.de&&periodoCustom.ate)ROUTES[current].render();}

   MARMITA LUCRATIVA · módulos próprios
   O que muda em relação ao Flow: não existe rateio de custo fixo aqui.
   O preço nasce do custo da ficha + imposto + o que o canal e a maquininha
   levam, mirando um CMV alvo ou uma margem de contribuição alvo.

const MESES_PT=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* ---- totais do cardápio (versão enxuta; sem lançamentos e sem custo fixo) ---- */
function totaisGerais(){
  let receitaEst=0,custoTot=0,vendas=0,custoUnit=0,precoUnit=0,mcTot=0;
  fichasVendaveis().forEach(f=>{const m=metricasFicha(f);
    receitaEst+=m.receita; custoTot+=m.custo*m.vendas; vendas+=m.vendas; mcTot+=m.mcTotal;
    if(m.precoBlend>0){custoUnit+=m.custo;precoUnit+=m.precoBlend;}});
  const cmvPct=receitaEst>0?(custoTot/receitaEst):(precoUnit>0?custoUnit/precoUnit:0);
  return {receita:receitaEst,faturamento:receitaEst,custoTot,cmv:cmvPct*100,vendas,
          ticket:vendas?receitaEst/vendas:0,mcTot,lucro:mcTot,fixos:0,fixosPct:0};
}

/* ===================== PRECIFICAÇÃO ===================== */
const ARRED=[['','Sem arredondar'],['90','Terminar em ,90'],['99','Terminar em ,99'],['50','Múltiplo de R$ 0,50'],['int','Número inteiro']];
function prec(){DB.prec=DB.prec||{};const p=DB.prec;
  if(p.modo!=='mc')p.modo='cmv';
  if(p.margemAlvo==null)p.margemAlvo=55;
  if(p.arredondar==null)p.arredondar='90';
  if(p.usarCartao==null)p.usarCartao=true;
  return p;}
function precCartaoPct(){return prec().usarCartao?taxaMediaRec():0;}

/* preço que entrega o alvo, dado o custo e o que sai de cima do preço */
function precoIdeal(custo,comissaoPct,cartaoPct){
  const p=prec(), k=(comissaoPct+cartaoPct)/100, imp=impostoVarPct()/100;
  if(custo<=0)return 0;
  if(p.modo==='cmv'){const alvo=(cmvAlvoRef()||30)/100;const base=alvo*(1-k);return base>0?custo/base:0;}
  const den=1-k-imp-((p.margemAlvo||0)/100);
  return den>0?custo/den:0;
}
function arredondaPreco(v){
  const modo=prec().arredondar;
  if(!v||!isFinite(v)||v<=0)return 0;
  const cent=x=>Math.round(x*100)/100;
  if(modo==='int')return Math.ceil(v-1e-9);
  if(modo==='50')return cent(Math.ceil((v-1e-9)*2)/2);
  if(modo==='90'||modo==='99'){
    const term=modo==='90'?0.90:0.99, base=Math.floor(v-1e-9);
    return cent(base+term>=v-1e-9?base+term:base+1+term);
  }
  return cent(v);
}
/* como o preço se comporta: quem leva o quê e quanto sobra */
function metricaPreco(preco,custo,comissaoPct,cartaoPct){
  preco=+preco||0;custo=+custo||0;
  const impPct=impostoVarPct();
  const comissao=preco*comissaoPct/100, cartao=preco*cartaoPct/100, imposto=preco*impPct/100;
  const liquido=preco-comissao-cartao;
  const mc=preco-custo-comissao-cartao-imposto;
  return {preco,custo,comissao,cartao,imposto,liquido,mc,
          mcPct:preco?mc/preco*100:0, cmv:liquido>0?custo/liquido*100:0, markup:custo?preco/custo:0};
}
/* linhas de cálculo: balcão + cada canal de delivery */
function precLinhas(custo){
  const out=[{key:'balcao',nome:'Balcão / app próprio',comissao:0,cartao:precCartaoPct()}];
  canaisVenda().forEach(c=>out.push({key:c.id,nome:c.nome||'Delivery',comissao:canalTaxa(c),cartao:0}));
  return out.map(l=>{
    const ideal=arredondaPreco(precoIdeal(custo,l.comissao,l.cartao));
    return Object.assign({},l,{ideal,m:metricaPreco(ideal,custo,l.comissao,l.cartao)});
  });
}

/* ---- o que dá para precificar: as marmitas cadastradas ----
   (a marmita modular foi desligada em 05/09/2026: confundia mais do que ajudava) */
function precItens(){
  const out=Object.values(DB.fichas).map(f=>({
    tipo:'ficha', id:f.id, nome:f.nome, cat:f.cat, obj:f, custo:custoProduto(f)}));
  return out.sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
}
function precItemPorId(id){return precItens().find(x=>x.id===id)||null;}
function precoAtualFicha(f,key){return key==='balcao'?(+f.precoVenda||0):(+((f.precos||{})[key])||0);}
function precoAtualItem(it,key){
  if(!it)return 0;
  if(it.tipo==='modular')return key==='balcao'?(+it.obj.precoBase||0):(+((it.obj.precos||{})[key])||0);
  return precoAtualFicha(it.obj,key);
}
function precAplicarItem(it){
  const linhas=precLinhas(it.custo), o=it.obj;
  o.precos=o.precos||{};
  linhas.forEach(l=>{
    if(l.key==='balcao'){ if(it.tipo==='modular')o.precoBase=l.ideal; else o.precoVenda=l.ideal; }
    else o.precos[l.key]=l.ideal;
  });
}
/* diagnóstico de um item: preço ideal x preço praticado hoje, canal a canal */
function precDiag(it){
  return precLinhas(it.custo).map(l=>{
    const atual=precoAtualItem(it,l.key);
    return Object.assign({},l,{atual,mAtual:atual>0?metricaPreco(atual,it.custo,l.comissao,l.cartao):null});
  });
}

          <div style="font-family:'Fraunces',serif;font-size:31px;font-weight:700;color:var(--navy);line-height:1.15;margin-top:6px">${fmtBRL(l.ideal)}</div>
          ${l.atual>0?`<div style="font-size:12px;margin-top:2px;color:${Math.abs(l.ideal-l.atual)<0.01?'var(--muted)':(l.ideal>l.atual?'var(--red)':'var(--green)')}">
              hoje ${fmtBRL(l.atual)} · ${Math.abs(l.ideal-l.atual)<0.01?'no ponto':(l.ideal>l.atual?'faltam '+fmtBRL(l.ideal-l.atual):'dá para baixar '+fmtBRL(l.atual-l.ideal))}</div>`
            :'<div style="font-size:12px;margin-top:2px;color:var(--soft)">sem preço cadastrado</div>'}
          <div style="border-top:1px solid var(--line);margin:11px 0 9px"></div>
          <div class="frow"><span class="l">Custo${ehMod?' (pior caso)':''}</span><b>${fmtBRL(l.m.custo)}</b></div>
          ${l.m.comissao>0?`<div class="frow"><span class="l">Comissão do canal</span><b>−${fmtBRL(l.m.comissao)}</b></div>`:''}
          ${l.m.cartao>0?`<div class="frow"><span class="l">Maquininha</span><b>−${fmtBRL(l.m.cartao)}</b></div>`:''}
          <div class="frow"><span class="l">Imposto</span><b>−${fmtBRL(l.m.imposto)}</b></div>
          <div class="frow div"><span class="l">Sobra por marmita</span><b style="color:${l.m.mc>0?'var(--green)':'var(--red)'}">${fmtBRL(l.m.mc)} · ${fmtPct(l.m.mcPct)}</b></div>
          <div class="frow"><span class="l">CMV no preço ideal</span><b style="color:${cmvCorRef(l.m.cmv)}">${fmtPct(l.m.cmv)}</b></div>
          ${l.mAtual?`<div class="frow"><span class="l">CMV no preço de hoje</span><b style="color:${cmvCorRef(l.mAtual.cmv)}">${fmtPct(l.mAtual.cmv)}</b></div>`:''}
        </div>`).join('')}
    </div>
  </div>
  ${it?(ehMod?precQuebraModularHTML(it):precQuebraHTML(it.obj,custo)):''}`;
}
/* de onde vem o custo: marmita comum, produto a produto */
function precQuebraHTML(f,custo){
  const itens=(f.comps||[]).map(([id,q])=>{const ins=DB.insumos[id];if(!ins)return null;
      return {nome:ins.nome,qtd:q,uni:bSym(ins.uni),valor:custoInsumoBase(ins)*(q||0)/(f.porcoes||1)};})
    .filter(Boolean).sort((a,b)=>b.valor-a.valor);
  const emb=+f.custoEmbalagem||0;
  if(emb>0)itens.push({nome:'Embalagem (marmitex, sacola, talher)',qtd:null,uni:'',valor:emb});
  const tot=itens.reduce((s,x)=>s+x.valor,0)||1;
  return `<div class="card card-pad">
    <div class="section-head"><div><div class="ttl">De onde vem o custo</div><div class="desc">O que mais pesa em cada marmita ${esc(f.nome)}</div></div>
      <span class="tag tag-navy">${fmtBRL(custo)}</span></div>
    <div style="display:flex;flex-direction:column;gap:9px">
      ${itens.slice(0,12).map(x=>`<div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;gap:10px">
          <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.nome)}${x.qtd!=null?` <span style="color:var(--soft)">${fmtN(x.qtd)}${x.uni}</span>`:''}</span>
          <b style="white-space:nowrap">${fmtBRL(x.valor)} <span style="color:var(--soft);font-weight:500">${fmtPct(x.valor/tot*100)}</span></b></div>
        <div class="bar" style="height:6px"><i style="width:${clamp(x.valor/tot*100,0,100)}%;background:${x.qtd==null?'var(--gold)':'var(--navy)'}"></i></div>
      </div>`).join('')}
    </div>
  </div>`;
}
/* de onde vem o custo: modular, módulo a módulo, mostrando o que a escolha do cliente pesa */
function precQuebraModularHTML(it){
  const m=it.obj;
  const linhas=(m.modulos||[]).map(mod=>{
    const ops=(mod.opcoes||[]).filter(o=>(o.nome||'').trim()||o.custo||o.fichaId);
    if(!ops.length)return null;
    const vals=ops.map(o=>({nome:o.nome||'(sem nome)',custo:opcaoCusto(o),padrao:!!o.padrao}));
    const cara=vals.slice().sort((a,b)=>b.custo-a.custo)[0];
    const pad=vals.find(v=>v.padrao)||vals[0];
    const min=mod.obrigatorio?vals.slice().sort((a,b)=>a.custo-b.custo)[0]:{nome:'não incluir',custo:0};
    return {nome:mod.nome||'Módulo',obrigatorio:!!mod.obrigatorio,cara,pad,min,n:vals.length};
  }).filter(Boolean);
  const totMax=linhas.reduce((s,x)=>s+x.cara.custo,0)||1;
  return `<div class="card card-pad">
    <div class="section-head"><div><div class="ttl">O que a escolha do cliente pesa</div><div class="desc">Módulo a módulo, do mais barato ao mais caro</div></div>
      <span class="tag tag-navy">pior caso ${fmtBRL(it.custo)}</span></div>
    <div class="scroll-x"><table class="tb" style="min-width:560px">
      <thead><tr><th>Módulo</th><th>Mais barata</th><th>Padrão</th><th>Mais cara</th><th class="num">Peso no pior caso</th></tr></thead>
      <tbody>${linhas.map(x=>`<tr>
        <td><b>${esc(x.nome)}</b><div style="font-size:11px;color:var(--soft)">${x.n} opç${x.n>1?'ões':'ão'}${x.obrigatorio?' · obrigatório':' · opcional'}</div></td>
        <td style="color:var(--green)">${esc(x.min.nome)}<div style="font-size:11px;color:var(--soft)">${fmtBRL(x.min.custo)}</div></td>
        <td>${esc(x.pad.nome)}<div style="font-size:11px;color:var(--soft)">${fmtBRL(x.pad.custo)}</div></td>
        <td style="color:var(--red)">${esc(x.cara.nome)}<div style="font-size:11px;color:var(--soft)">${fmtBRL(x.cara.custo)}</div></td>
        <td class="num"><b>${fmtPct(x.cara.custo/totMax*100)}</b></td>
      </tr>`).join('')}</tbody></table></div>
    <div style="font-size:11.5px;color:var(--soft);margin-top:10px">A diferença entre a padrão (${fmtBRL(it.custoPadrao)}) e a mais cara (${fmtBRL(it.custo)}) é de <b>${fmtBRL(it.custo-it.custoPadrao)}</b> por marmita. Se essa diferença estiver grande demais para embutir no preço, cobre à parte pela opção mais cara.</div>
  </div>`;
}
function precAplicar(id){
  const it=precItemPorId(id);if(!it)return;
  precAplicarItem(it);
  save();viewPrecificacao();toast('Preços aplicados em '+it.nome);
}

/* ---------- aba Tabela de preços ---------- */
function precTabelaHTML(){
  const itens=precItens();
  if(!itens.length)return `<div class="card">${emptyState('Nenhuma marmita cadastrada','Monte a ficha da sua marmita para calcular o preço ideal.','go(&#39;fichas&#39;)')}</div>`;
  const cols=[{key:'balcao',nome:'Balcão'}].concat(canaisVenda().map(c=>({key:c.id,nome:c.nome||'Delivery'})));
  const temMod=itens.some(x=>x.tipo==='modular');
  const rows=itens.map(it=>{
    const byKey={};precDiag(it).forEach(l=>byKey[l.key]=l);
    return `<tr>
      <td><b>${esc(it.nome)}</b>${it.tipo==='modular'?' <span class="tag tag-gold" style="font-size:9.5px">modular</span>':''}<div style="font-size:11px;color:var(--soft)">${esc(it.cat||'—')}</div></td>
      <td class="num">${fmtBRL(it.custo)}${it.tipo==='modular'?`<div style="font-size:11px;color:var(--soft)">padrão ${fmtBRL(it.custoPadrao)}</div>`:''}</td>
      ${cols.map(c=>{const l=byKey[c.key];if(!l)return '<td class="num">—</td>';
        return `<td class="num">
          <b style="color:var(--navy)">${fmtBRL(l.ideal)}</b>
          <div style="font-size:11px;color:${l.atual<=0?'var(--soft)':(Math.abs(l.ideal-l.atual)<0.01?'var(--muted)':(l.ideal>l.atual?'var(--red)':'var(--green)'))}">
            ${l.atual>0?fmtBRL(l.atual)+(Math.abs(l.ideal-l.atual)<0.01?' ✓':(l.ideal>l.atual?' ▲'+fmtBRL(l.ideal-l.atual):' ▼'+fmtBRL(l.atual-l.ideal))):'sem preço'}</div></td>`;}).join('')}
      <td class="num"><button class="btn btn-ghost btn-sm" onclick="precAplicar('${it.id}')">Aplicar</button></td>
    </tr>`;}).join('');
  const p=prec();
  return `<div class="card card-pad">
    <div class="section-head"><div><div class="ttl">Preço ideal de cada marmita</div>
      <div class="desc">Mirando ${p.modo==='cmv'?'CMV de '+fmtPct(cmvAlvoRef()):'margem de '+fmtPct(p.margemAlvo)} · imposto ${fmtPct(impostoVarPct())}${p.usarCartao?' · maquininha '+fmtPct(taxaMediaRec())+' no balcão':''}</div></div>
      <button class="btn btn-primary btn-sm" onclick="precAplicarTodas()">Aplicar em todas</button></div>
    <div class="scroll-x"><table class="tb" style="min-width:680px">
      <thead><tr><th>Marmita</th><th class="num">Custo</th>${cols.map(c=>`<th class="num">${esc(c.nome)}</th>`).join('')}<th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div style="font-size:11.5px;color:var(--soft);margin-top:10px">O número grande é o preço ideal. Embaixo, o preço que está na ficha hoje: <b style="color:var(--red)">▲</b> abaixo do ideal, <b style="color:var(--green)">▼</b> acima, <b>✓</b> no ponto.${temMod?' Nas <b>modulares</b> o custo mostrado é o da combinação mais cara, porque o preço precisa cobrir qualquer escolha do cliente.':''}</div>
  </div>`;
}
function precAplicarTodas(){
  const itens=precItens();
  if(!itens.length)return;
  if(!confirm('Isto substitui o preço de venda de todas as '+itens.length+' marmitas pelo preço ideal calculado. Continuar?'))return;
  itens.forEach(precAplicarItem);
  save();viewPrecificacao();toast('Preços atualizados em '+itens.length+' marmitas');
}
