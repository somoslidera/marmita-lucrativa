function viewDashboard(){
  $('#topActions').innerHTML=`<button class="btn btn-primary" onclick="go('precificacao')">${ico('mc')} Precificar</button>`;
  const itens=precItens();
  if(!itens.length){$('#view').innerHTML=`<div class="card">${emptyState('Comece pela sua marmita','Cadastre os produtos que você compra e monte a ficha da marmita. O preço ideal sai daí.','go(&#39;insumos&#39;)')}</div>`;return;}
  const diag=itens.map(it=>{const d=precDiag(it);return {it,d,balcao:d[0]};});
  const comPreco=diag.filter(x=>x.balcao.atual>0);
  const semPreco=diag.filter(x=>!(x.balcao.atual>0));
  const custoMed=itens.reduce((s,x)=>s+x.custo,0)/itens.length;
  const precoMed=comPreco.length?comPreco.reduce((s,x)=>s+x.balcao.atual,0)/comPreco.length:0;
  const cmvMed=comPreco.length?comPreco.reduce((s,x)=>s+x.balcao.mAtual.cmv,0)/comPreco.length:0;
  const mcMed=comPreco.length?comPreco.reduce((s,x)=>s+x.balcao.mAtual.mc,0)/comPreco.length:0;
  const criticas=comPreco.filter(x=>cmvClasse(x.balcao.mAtual.cmv)==='critico').sort((a,b)=>b.balcao.mAtual.cmv-a.balcao.mAtual.cmv);
  const atencao=comPreco.filter(x=>cmvClasse(x.balcao.mAtual.cmv)==='atencao');
  const prejuizo=comPreco.filter(x=>x.d.some(l=>l.mAtual&&l.mAtual.mc<0));
  const t=totaisGerais();
  const rank=Object.values(DB.fichas).map(f=>({f,m:metricasFicha(f)})).filter(x=>x.f.precoVenda>0)
    .sort((a,b)=>b.m.mcTotal-a.m.mcTotal).slice(0,6);
  const maxMc=Math.max(1,...rank.map(x=>x.m.mcTotal));
  const nMod=itens.filter(x=>x.tipo==='modular').length;

  let alerts='';
  prejuizo.slice(0,3).forEach(x=>alerts+=alertRow('red',icoWarn,`<b>${esc(x.it.nome)}</b> está vendendo <b>no prejuízo</b> em pelo menos um canal. Recalcule o preço.`));
  criticas.slice(0,3).forEach(x=>alerts+=alertRow('red',icoWarn,`<b>${esc(x.it.nome)}</b>: CMV de ${fmtPct(x.balcao.mAtual.cmv)}, acima do limite de ${fmtPct(cmvUpRef())}.${x.it.tipo==='modular'?' (na combinação mais cara)':''}`));
  atencao.slice(0,2).forEach(x=>alerts+=alertRow('amber',icoWarn,`<b>${esc(x.it.nome)}</b>: CMV em ${fmtPct(x.balcao.mAtual.cmv)}, passou da meta de ${fmtPct(cmvAlvoRef())}.`));
  if(semPreco.length)alerts+=alertRow('amber',icoWarn,`${semPreco.length} marmita${semPreco.length>1?'s':''} sem preço de venda: ${semPreco.slice(0,3).map(x=>esc(x.it.nome)).join(', ')}${semPreco.length>3?'…':''}`);
  if(!alerts)alerts=alertRow('green',icoOk,'Nenhum alerta. Todas as marmitas estão dentro da meta de CMV.');

  const kpi=(rot,val,sub,cor)=>`<div class="card card-pad" style="min-width:0">
    <div style="font-size:12px;color:var(--muted);font-weight:600">${rot}</div>
    <div style="font-family:'Fraunces',serif;font-size:27px;font-weight:700;margin-top:3px;color:${cor||'var(--ink)'}">${val}</div>
    <div style="font-size:11.5px;color:var(--soft);margin-top:2px">${sub}</div></div>`;

  const avisoExemplo=(DB._exemplo&&DB.exemploAviso!==false)
    ?`<div class="alert alert-amber" style="margin-bottom:16px;align-items:flex-start">${icoWarn}<div><b>Sua loja já vem montada.</b> Estes produtos e marmitas são um exemplo com preços de mercado, para você não começar do zero. Troque pelos seus preços, mude o que quiser e apague o que não usa. <a onclick="DB.exemploAviso=false;save();viewDashboard()" style="cursor:pointer;font-weight:700;white-space:nowrap;text-decoration:underline">Entendi</a></div></div>`:'';
  $('#view').innerHTML=`${avisoExemplo}
  <div class="card card-pad hero-card" style="margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px">
    <div><div class="hero-sub">${esc((DB.conta&&DB.conta.restaurante)||'Sua marmitaria')}</div>
      <div style="font-size:20px;font-weight:700;font-family:'Fraunces',serif;margin-top:2px">${itens.length} marmita${itens.length>1?'s':''} no cardápio${nMod?` <span style="font-size:13px;font-weight:400;opacity:.75;white-space:nowrap">· ${nMod} modular${nMod>1?'es':''}</span>`:''}</div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div class="dash-pill"><span>CMV médio</span><b style="color:${cmvCorRef(cmvMed)}">${comPreco.length?fmtPct(cmvMed):'—'}</b></div>
      <div class="dash-pill"><span>Sobra por marmita</span><b style="color:${mcMed>=0?'var(--green)':'var(--red)'}">${comPreco.length?fmtBRL(mcMed):'—'}</b></div>
      <div class="dash-pill"><span>Meta de CMV</span><b>${fmtPct(cmvAlvoRef())}</b></div>
    </div>
  </div>

  <div class="kpi-mob" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:20px">
    ${kpi('Custo médio',fmtBRL(custoMed),'produtos + embalagem')}
    ${kpi('Preço médio',precoMed>0?fmtBRL(precoMed):'—','venda no balcão')}
    ${kpi('Dentro da meta',`${comPreco.length-criticas.length-atencao.length} de ${comPreco.length}`,'marmitas com preço',(comPreco.length&&criticas.length===0)?'var(--green)':'var(--amber)')}
    ${kpi('Sobra do mês',t.vendas>0?fmtBRL(t.mcTot):'—',t.vendas>0?fmtN(t.vendas)+' marmitas/mês':'preencha as vendas/mês na ficha')}
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px" class="dash-grid">
    <div class="card card-pad">
      <div class="section-head"><div><div class="ttl">O que precisa de atenção</div><div class="desc">Meta de CMV em ${fmtPct(cmvAlvoRef())}, limite em ${fmtPct(cmvUpRef())}</div></div></div>
      ${alerts}
      <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="go('precificacao')">Abrir a calculadora de preço →</button>
    </div>
    <div class="card card-pad">
      <div class="section-head"><div><div class="ttl">Quem traz mais dinheiro</div><div class="desc">Sobra por mês = sobra por marmita × vendas/mês</div></div></div>
      ${t.vendas>0?`<div style="display:flex;flex-direction:column;gap:10px">
        ${rank.map(x=>`<div>
          <div style="display:flex;justify-content:space-between;font-size:12.5px;gap:10px">
            <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.f.nome)}</span>
            <b style="white-space:nowrap">${fmtBRL(x.m.mcTotal)}</b></div>
          <div class="bar" style="height:7px"><i style="width:${clamp(x.m.mcTotal/maxMc*100,0,100)}%;background:${x.m.mcTotal>=0?'var(--navy)':'var(--red)'}"></i></div>
        </div>`).join('')}
        ${nMod?`<div style="font-size:11.5px;color:var(--soft);margin-top:2px">As modulares não entram neste ranking: elas não têm média de vendas por mês.</div>`:''}</div>`
        :`<div style="font-size:12.5px;color:var(--soft)">Preencha a <b>média de vendas por mês</b> em cada ficha para ver o ranking e liberar a Engenharia de Cardápio.</div>`}
    </div>
  </div>`;
}

/* ---- botão "sugerir preço" dentro da ficha da marmita ---- */
function fichaSugerirPrecos(){
  const custo=fichaCustoAtual();
  if(custo<=0)return toast('Adicione os produtos da marmita antes de sugerir o preço');

/* recalcula os CMV do box de preço da modular sem redesenhar o modal (não perde o foco) */
function modUpdPrecoCMV(){
  const m=draftMod;if(!m)return;
  const max=custoModular(m,'max');
  const set=(key,preco,comissao,cartao)=>{const el=document.getElementById('mod_cmv_'+key);if(!el)return;
    if(!(preco>0)||max<=0){el.textContent='—';el.style.color='var(--soft)';return;}
    const mm=metricaPreco(preco,max,comissao,cartao);
    el.textContent=fmtPct(mm.cmv);el.style.color=cmvCorRef(mm.cmv);};
  set('balcao',+m.precoBase||0,0,precCartaoPct());
  canaisVenda().forEach(c=>set(c.id,+((m.precos||{})[c.id])||0,canalTaxa(c),0));
}
function modSugerirPrecos(){
  const max=custoModular(draftMod,'max');
  if(max<=0)return toast('Preencha os custos das opções antes de sugerir o preço');
  draftMod.precos=draftMod.precos||{};
  precLinhas(max).forEach(l=>{if(l.key==='balcao')draftMod.precoBase=l.ideal;else draftMod.precos[l.key]=l.ideal;});
  modRerender();
  toast('Preços sugeridos para a combinação mais cara');
}

/* ---- impressão ----
   No computador o window.print() segura a execução até o diálogo fechar, então
   limpar a área 1,5s depois funcionava. No celular ele retorna na hora e o
   preview é montado depois: a limpeza apagava a ficha antes de ela ser
   desenhada, e a impressão saía em branco. Agora só limpamos quando a impressão
   realmente termina. */
function prepararImpressao(area,classe){
  let limpo=false, mq=null, guarda=null;
  const aoMudar=e=>{if(!e.matches)fim();};
  function fim(){
    if(limpo)return;limpo=true;
    document.body.classList.remove(classe);
    if(area)area.innerHTML='';
    window.removeEventListener('afterprint',fim);
    if(mq)try{mq.removeEventListener('change',aoMudar);}catch(e){}
    if(guarda)clearTimeout(guarda);
  }
  try{mq=window.matchMedia('print');mq.addEventListener('change',aoMudar);}catch(e){}
  window.addEventListener('afterprint',fim);
  guarda=setTimeout(fim,120000); // rede de segurança, não é o caminho normal
  if(window.self!==window.top)toast('Dentro do visualizador a impressão pode não abrir. Abra o app em uma aba própria.');
  setTimeout(()=>{try{window.print();}catch(e){toast('O navegador bloqueou a impressão. Use o menu do navegador.');fim();}},80);
}

  current=route;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.route===route));
  $('#pageTitle').textContent=ROUTES[route].title;$('#topActions').innerHTML='';ROUTES[route].render();window.scrollTo(0,0);toggleSidebar(false);
  marcarTab(route);fecharMaisAcoes();compactarAcoes();}
document.querySelectorAll('#nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(a.dataset.route);}));
function toggleSidebar(open){const sb=$('#sidebar'),bd=$('#backdrop');if(open===undefined)open=!sb.classList.contains('open');sb.classList.toggle('open',open);bd.classList.toggle('hidden',!open);}
function normData(){
  DB.fin=DB.fin||{};const f=DB.fin;
  DB.fat=DB.fat||{};
  // --- migra o iFood fixo para a lista de canais (roda 1x, sem perder nada) ---
  if(!Array.isArray(f.canais)){
    f.canais=[{id:'ifood',nome:'iFood',taxa:(f.comissaoIfood!=null?+f.comissaoIfood:27),mix:clamp(+DB.fat.mixIfood||0,0,100)}];
  }
  f.canais=f.canais.filter(c=>c&&c.id).slice(0,CANAIS_MAX);
  f.canais.forEach(c=>{c.nome=(''+(c.nome||'')).trim()||'Delivery';c.taxa=Math.max(0,+c.taxa||0);c.mix=clamp(+c.mix||0,0,100);});
  // --- migra os meios de recebimento (roda 1x) ---
  if(!Array.isArray(f.meios)){
    const antigos=Array.isArray(f.meiosPagamento)?f.meiosPagamento.filter(m=>m&&(m.nome||'').trim()):[];
    f.meios = antigos.length
      ? antigos.map(m=>({id:m.id||('mr'+uid()),nome:(''+m.nome).trim(),tipo:m.tipo||'Crédito',taxa:Math.max(0,+m.taxa||0)}))
      : [{id:'mrCred',nome:'Cartão de Crédito',tipo:'Crédito',taxa:Math.max(0,+f.taxaCartao||0)},
         {id:'mrDeb', nome:'Cartão de Débito', tipo:'Débito', taxa:Math.max(0,+f.taxaDebito||0)},
         {id:'mrPix', nome:'PIX',              tipo:'PIX',    taxa:Math.max(0,+f.taxaPix||0)}];
  }
  f.meios=f.meios.filter(m=>m&&m.id);
  f.meios.forEach(m=>{m.nome=(''+(m.nome||'')).trim()||'Meio de recebimento';m.tipo=m.tipo||'Crédito';m.taxa=Math.max(0,+m.taxa||0);
    if(m.prazo==null)m.prazo=(m.tipo==='Crédito')?30:(m.tipo==='Débito'?1:0);m.prazo=Math.max(0,parseInt(m.prazo)||0);});
  if(f.receitaBruta==null)f.receitaBruta=true;
  sincronizarMeios();
  Object.values(DB.fichas||{}).forEach(fi=>{if(!fi||typeof fi!=='object')return;
    if(!fi.precos||typeof fi.precos!=='object')fi.precos={};
    if(fi.precos.ifood==null&&+fi.precoIfood>0)fi.precos.ifood=+fi.precoIfood;});  // preço antigo do iFood
  if(f.regime==='mei'){f.mei=true;f.regime='simples';}            // migra regime antigo
  if(f.mei==null)f.mei=false;
  if(f.regime==null||!['simples','presumido','lucroReal'].includes(f.regime))f.regime='simples';
  if(f.aliquota==null)f.aliquota=6; if(f.impostoFixo==null)f.impostoFixo=75;
  if(f.inssSocio==null)f.inssSocio=11;
  if(f.comissaoIfood==null)f.comissaoIfood=27; if(f.taxaCartao==null)f.taxaCartao=2.5;
  // encargos CLT detalhados (FGTS + INSS + provisões 13º/férias), migra do encargoCLT antigo
  if(f.encFGTS==null||f.encINSS==null||f.encProv==null){f.encFGTS=8;f.encINSS=0;f.encProv=PROV_PADRAO;}
  if(!f._encV){f.encProv=PROV_PADRAO;f._encV=1;} // o campo de provisões nunca entrou na conta (a folha usava 11,11% fixo); alinha o valor salvo ao custo que já era aplicado
  f.imovel=f.imovel||{}; f.utilidades=f.utilidades||{}; f.servicosRec=f.servicosRec||{}; f.operacionais=f.operacionais||{}; f.sistemas=f.sistemas||{}; f.marketing=f.marketing||{};
  f.marketing.canais=f.marketing.canais||[]; // múltiplos canais de tráfego/mídia
  if(f.marketing.trafego>0&&!f.marketing.canais.length){f.marketing.canais.push({nome:f.marketing.plataforma||'Tráfego pago',valor:f.marketing.trafego});f.marketing.trafego=0;}
  f.servicosMensais=f.servicosMensais||[]; f.equipamentos=f.equipamentos||[]; f.veiculos=f.veiculos||[]; f.marketplaces=f.marketplaces||[]; f.operadorasCartao=f.operadorasCartao||[]; f.historicoFat=f.historicoFat||[];
  f.funcionarios=f.funcionarios||[]; f.socios=f.socios||[];

  DB.conta=DB.conta||{};

const SORTCOLS={
 insumos:{nome:i=>i.nome,cat:i=>i.cat,grupo:i=>i.grupo||'',sub:i=>i.sub||i.cat||'',fornecedor:i=>i.fornecedor||'',preco:i=>i.preco||0,qtd:i=>i.qtd||0,custo:i=>custoInsumoBase(i)*(TO_BASE[i.uni]||1),noEstoque:i=>i.noEstoque!==false?1:0},

function applySort(tab,arr){const s=SORT[tab],acc=SORTCOLS[tab][s.k];if(!acc)return arr;return arr.slice().sort((a,b)=>{let x=acc(a),y=acc(b);if(typeof x==='string'||typeof y==='string'){x=(x||'').toString().toLowerCase();y=(y||'').toString().toLowerCase();return x<y?-s.d:x>y?s.d:0;}return ((x||0)-(y||0))*s.d;});}

function insumoAOA(modo){
  const header=['Produto/Insumo','Grupo','Fornecedor','Peso/Conteúdo','Unidade','Valor Embalagem'];
  if(modo==='modelo')return [header];   // modelo em branco, só o cabeçalho
  const prontos=Object.values(DB.insumos).filter(i=>i.tipo!=='preparado');
  return [header,...prontos.map(i=>[i.nome,i.cat,i.fornecedor||'',i.qtd,uSym(i.uni),i.preco])];
}
async function exportarInsumos(modo,fmt){const aoa=insumoAOA(modo);const arq=modo==='modelo'?'modelo-insumos':'meus-insumos';
  if(fmt==='csv'){
    const csv=aoa.map(r=>r.map(c=>{let s=(typeof c==='number')?String(c).replace('.',','):String(c);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(';')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));a.download=arq+'.csv';a.click();
  }else{
    try{const XLSX=await loadXLSX();const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:26},{wch:16},{wch:14},{wch:16},{wch:10},{wch:16}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Insumos');XLSX.writeFile(wb,arq+'.xlsx');}
    catch(e){return toast('Não foi possível gerar o Excel. Tente CSV.');}
  }
  closeModal();toast(modo==='modelo'?'Modelo baixado':'Insumos exportados');
}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error('xlsx'));document.head.appendChild(s);});}
function parseCSV(text){text=text.replace(/^﻿/,'');const l0=(text.split('\n')[0]||'');const delim=((l0.match(/;/g)||[]).length>=(l0.match(/,/g)||[]).length)?';':',';
  const rows=[];let cur=[],val='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){val+='"';i++;}else q=false;}else val+=ch;}
    else{if(ch==='"')q=true;else if(ch===delim){cur.push(val);val='';}else if(ch==='\n'){cur.push(val);rows.push(cur);cur=[];val='';}else if(ch==='\r'){}else val+=ch;}}
  if(val.length||cur.length){cur.push(val);rows.push(cur);}return rows;}
function normUni(s){s=(s||'').toString().trim().toLowerCase();const m={g:'g',gr:'g',grama:'g',gramas:'g',kg:'kg',quilo:'kg',quilos:'kg',quilograma:'kg',quilogramas:'kg',ml:'ml',mililitro:'ml',mililitros:'ml',l:'L',lt:'L',litro:'L',litros:'L',un:'un',und:'un',unid:'un',unidade:'un',unidades:'un',pc:'un'};return m[s]||'un';}
function parseNumBR(s){if(typeof s==='number')return s;s=(s||'').toString().replace(/[^\d.,-]/g,'').trim();if(!s)return 0;
  if(s.indexOf(',')>=0&&s.indexOf('.')>=0)s=s.replace(/\./g,'').replace(',','.');else if(s.indexOf(',')>=0)s=s.replace(',','.');
  return parseFloat(s)||0;}
async function importarInsumos(input){const f=input&&input.files&&input.files[0];if(input)input.value='';if(!f)return;
  let rows;
  try{
    if(/\.xlsx?$/i.test(f.name)){const XLSX=await loadXLSX();const data=new Uint8Array(await f.arrayBuffer());const wb=XLSX.read(data,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});}
    else{rows=parseCSV(await f.text());}
  }catch(e){return toast('Não foi possível ler o arquivo. Use o modelo em Baixar.');}
  aplicarImportInsumos(rows);
}
function aplicarImportInsumos(rows){rows=(rows||[]).filter(r=>r&&r.some(c=>(c||'').toString().trim()!==''));
  if(!rows.length)return toast('Planilha vazia');
  const head=rows[0].map(c=>(c||'').toString().toLowerCase());
  const find=(...keys)=>head.findIndex(h=>keys.some(k=>h.indexOf(k)>=0));
  let iNome=find('produto','insumo','nome'),iCat=find('grupo','categ'),iForn=find('fornec'),iUni=find('unidade','unid','und'),iQtd=find('peso','conteúdo','conteudo','quant','qtd','compra'),iVal=find('embalagem','valor','preç','pre');
  let start=1;
  if(iNome<0){iNome=0;iCat=1;iForn=-1;iUni=2;iQtd=3;iVal=4;start=0;}
  DB.fin=DB.fin||{};DB.fin.fornecedores=DB.fin.fornecedores||[];
  let n=0;
  for(let r=start;r<rows.length;r++){const row=rows[r]||[];const nome=(row[iNome]||'').toString().trim();if(!nome)continue;
    const cat=((iCat>=0&&row[iCat])?row[iCat]:'Mercearia').toString().trim()||'Mercearia';
    const forn=(iForn>=0&&row[iForn]?row[iForn]:'').toString().trim();
    const uni=normUni(iUni>=0?row[iUni]:'un');
    const qtd=parseNumBR(iQtd>=0?row[iQtd]:1)||1;
    const preco=parseNumBR(iVal>=0?row[iVal]:0);
    const nid=uid();DB.insumos[nid]={id:nid,nome,cat,grupo:'CMV',sub:cat,tipo:'pronto',uni,qtd,preco,fornecedor:forn};
    if(cat){nfeEnsureCats();const g=DB.categorias['CMV'];if(g&&!g.subs.includes(cat))g.subs.push(cat);} // a subcategoria da planilha entra na mesma lista dos Lançamentos
    if(forn&&!DB.fin.fornecedores.some(f=>(f.nome||'').toLowerCase()===forn.toLowerCase()))DB.fin.fornecedores.push({id:uid(),nome:forn,contato:''});
    n++;}
  if(!n)return toast('Nenhuma linha válida encontrada');
  save();viewInsumos();toast(n+' produto(s) importado(s)');
}

function custoLink(id,qtd){
  if(DB.fichas[id])return custoProduto(DB.fichas[id]);          // ficha: já é por porção
  const ins=DB.insumos[id];if(!ins)return 0;
  const q=+qtd, base=custoInsumoBase(ins);                       // preparado: custo da unidade-base
  if(q>0)return base*q;                                          // a porção que vai na marmita

function simRecalc(){

}

async function exportFichas(fmt){const aoa=fichaAOA();
  if(fmt==='csv'){const csv=aoa.map(r=>r.map(c=>{let s=(typeof c==='number')?String(c).replace('.',','):String(c);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));a.download='fichas.csv';a.click();}
  else{try{const X=await loadXLSX();const ws=X.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:26},{wch:18},{wch:18},{wch:16},{wch:14},{wch:14}];const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Fichas');X.writeFile(wb,'fichas.xlsx');}catch(e){return toast('Não foi possível gerar o Excel. Tente CSV.');}}
  closeModal();toast('Planilha baixada');

async function importarFichas(input){const f=input&&input.files&&input.files[0];if(input)input.value='';if(!f)return;
  let rows;try{if(/\.xlsx?$/i.test(f.name)){const X=await loadXLSX();const wb=X.read(new Uint8Array(await f.arrayBuffer()),{type:'array'});rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});}else rows=parseCSV(await f.text());}catch(e){return toast('Não foi possível ler o arquivo. Use o modelo em Baixar.');}
  aplicarImportFichas(rows);
}
function aplicarImportFichas(rows){rows=(rows||[]).filter(r=>r&&r.some(c=>(c||'').toString().trim()!==''));if(!rows.length)return toast('Planilha vazia');
  const head=rows[0].map(c=>(c||'').toString().toLowerCase());const find=(...k)=>head.findIndex(h=>k.some(x=>h.indexOf(x)>=0));
  let iN=find('prato','ficha','nome','produto'),iC=find('categ','grupo'),iR=find('rendim','porç','porc'),iE=find('embal'),iB=find('balc','venda','preç','preco'),iI=find('ifood','delivery');
  let start=1;if(iN<0){iN=0;iC=1;iR=2;iE=3;iB=4;iI=5;start=0;}
  // coluna de cada canal: procura pelo nome dele no cabeçalho; o 1º canal aceita a coluna antiga de iFood

/* Dois critérios de "item eficiente":
   CMV  = régua absoluta (dentro da meta de CMV das Configurações) — enxerga custo;
   MC   = régua relativa (margem de contribuição acima da média ponderada do cardápio),
          que é o método clássico da engenharia de cardápio — enxerga quanto sobra em R$. */
let engModo='cmv';
function engSetModo(m){engModo=(m==='mc')?'mc':'cmv';viewEngenharia();}
function classificar(modo){
  modo=(modo||engModo)==='mc'?'mc':'cmv';
  // só entra na Engenharia quem tem preço E vendas/mês preenchidas
  const arr=fichasVendaveis().filter(f=>(f.precoVenda||0)>0&&(f.vendasMes||0)>0).map(f=>{const m=metricasFicha(f);return{f,m,pop:f.vendasMes||0,marg:m.mcBlend,cmv:m.cmvBlend};});
  if(!arr.length)return [];
  const avgPop=arr.reduce((s,x)=>s+x.pop,0)/arr.length;
  const alvoCmv=cmvAlvoRef();
  const totPop=arr.reduce((s,x)=>s+x.pop,0);
  const mcMedio=totPop?arr.reduce((s,x)=>s+x.marg*x.pop,0)/totPop:0; // ponderada pelas vendas
  const porMC=modo==='mc';
  arr.forEach(x=>{const hiP=x.pop>=avgPop,eff=porMC?(x.marg>=mcMedio):(x.cmv<=alvoCmv);
    x.classe=hiP&&eff?'Estrelas':hiP&&!eff?'Populares':!hiP&&eff?'Potenciais':'Críticos';
    x.avgPop=avgPop;x.alvoCmv=alvoCmv;x.mcMedio=mcMedio;x.modo=modo;});
  // o número do item acompanha o ranking do critério escolhido (liga o ponto do gráfico à lista)
  [...arr].sort((a,b)=>porMC?(b.marg-a.marg):(a.cmv-b.cmv)).forEach((x,i)=>{x.n=i+1;});
  return arr;
}

/* ===================== COMPETÊNCIA × CAIXA =====================
   O lançamento tem DUAS dimensões de tempo:
     l.data        -> COMPETÊNCIA: quando o fato aconteceu. É o que o DRE lê.
     l.liquidacoes -> CAIXA: quando o dinheiro entra/sai. É o que o Fluxo lê.
   Sem liquidacoes o lançamento é à vista e o caixa cai na própria data, então
   todo o histórico anterior continua valendo sem migração.                      */
/* o que de fato pinga na conta: receita no cartão entra líquida da taxa */
/* liquidações de um lançamento; sem elas, uma só, à vista */
/* Parcelas em aberto viram Contas a Pagar/Receber. Elas JA estao no DRE
   (o lancamento entrou na data do fato), entao marcar como pago/recebido
   NAO cria lancamento nenhum: so registra que o dinheiro se moveu.        */
/* quantas parcelas ficaram para tras sem baixa (aparecem no mes delas, nao aqui) */
/* saldo de abertura: soma das contas bancárias cadastradas */
/* Saldo REAL: abertura + só o que foi efetivamente pago/recebido até a data.
   Parcela vencida e nao quitada nao sai do saldo, porque o dinheiro ainda esta la. */
/* Tudo que ainda vai acontecer: nao pago, incluindo vencido (continua a pagar) */
/* gera as parcelas de uma compra: n vezes, a cada 30 dias (ou intervalo dado) */
/* Aplica as liquidações de um lançamento novo.
   Receita: usa o prazo da bandeira (D+0 dinheiro/pix, D+1 débito, D+30 crédito).
   Despesa: usa a condição informada (à vista ou parcelado).
   Se nada se aplicar, deixa sem liquidacoes = à vista.                     */
const dreCollapsed=new Set();
/* ----- Lançamentos ----- */
/* ===== Taxas de cartão/PIX automáticas no DRE (sobre recebíveis) ===== */
/* ===== MEIOS DE RECEBIMENTO (bandeiras) =====
   Uma lista só, com id fixo (o nome é rótulo). Cada meio aparece como forma de
   pagamento no lançamento E como subcategoria de Receita. A taxa NÃO vira lançamento:
   o DRE calcula a linha na hora, então não polui a lista nem duplica gasto. */
const TAXA_SUB='Taxas de recebimento', TAXA_GRUPO='Despesas Financeiras';
/* o cadastro do meio alimenta os 2 lugares onde ele é escolhido: a Forma do
   lançamento e a subcategoria de Receita. Fonte única, sem redigitar. */
function sincronizarMeios(){const ms=meiosRec();if(!ms.length)return;
  DB.formasPagamento=DB.formasPagamento||[];
  DB.categorias=DB.categorias||{};
  const rec=DB.categorias['Receita'];
  ms.forEach(m=>{const nome=m.nome;
    if(!DB.formasPagamento.some(x=>(''+x).toLowerCase()===nome.toLowerCase()))DB.formasPagamento.push(nome);
    if(rec&&Array.isArray(rec.subs)&&!rec.subs.some(x=>(''+x).toLowerCase()===nome.toLowerCase()))rec.subs.push(nome);});

function renomearMeio(m,novo){const velho=m.nome;novo=(''+novo).trim();if(!novo||novo===velho)return;
  const eq=(a,b)=>(''+(a||'')).toLowerCase()===(''+(b||'')).toLowerCase();
  m.nome=novo;
  DB.formasPagamento=(DB.formasPagamento||[]).map(x=>eq(x,velho)?novo:x);
  const rec=DB.categorias&&DB.categorias['Receita'];
  if(rec&&Array.isArray(rec.subs))rec.subs=rec.subs.map(x=>eq(x,velho)?novo:x);
  (DB.lancamentos||[]).forEach(l=>{if(eq(l.forma,velho))l.forma=novo;if(eq(l.sub,velho))l.sub=novo;});
  sincronizarMeios();}

/* ===== Mesclagem 3-way (multiusuário: combina edições em vez de sobrescrever) ===== */
function _cloneDB(o){try{return JSON.parse(JSON.stringify(o));}catch(e){return o;}}
function _eq(a,b){return JSON.stringify(a)===JSON.stringify(b);}
function _isRec(v){return v&&typeof v==='object'&&!Array.isArray(v)&&('id' in v);}
function _isIdMap(o){if(!o||typeof o!=='object'||Array.isArray(o))return false;const v=Object.values(o);return v.length>0&&v.every(_isRec);}
function _mergeArr(base,mine,theirs){ // arrays de {id}: união por id (só-meu/só-dele preservados; ambos-mudaram → meu)
  const map=a=>{const m={};(a||[]).forEach(x=>{if(x&&x.id!=null)m[String(x.id)]=x;});return m;};
  const b=map(base),mi=map(mine),th=map(theirs),pick={};
  new Set([...Object.keys(b),...Object.keys(mi),...Object.keys(th)]).forEach(k=>{const iB=k in b,iM=k in mi,iT=k in th;
    if(iM&&iT)pick[k]=_eq(mi[k],b[k])?th[k]:mi[k];
    else if(iM&&!iT){if(!(iB&&_eq(mi[k],b[k])))pick[k]=mi[k];}      // ele apagou e eu não mexi → some; senão mantém o meu
    else if(!iM&&iT){if(!(iB&&_eq(th[k],b[k])))pick[k]=th[k];}});   // eu apaguei e ele não mexeu → some; senão mantém o dele
  const out=[],seen=new Set();
  (mine||[]).forEach(x=>{const k=x&&x.id!=null&&String(x.id);if(k&&(k in pick)&&!seen.has(k)){out.push(pick[k]);seen.add(k);}});
  (theirs||[]).forEach(x=>{const k=x&&x.id!=null&&String(x.id);if(k&&(k in pick)&&!seen.has(k)){out.push(pick[k]);seen.add(k);}});
  return out;
}
function _mergeUnion(base,mine,theirs){const out=(mine||[]).slice();(theirs||[]).forEach(x=>{if(!out.some(y=>_eq(y,x)))out.push(x);});return out;}
function _mergeObj(base,mine,theirs,atomic){
  base=base||{};const out={};
  new Set([...Object.keys(base),...Object.keys(mine),...Object.keys(theirs)]).forEach(k=>{const iB=k in base,iM=k in mine,iT=k in theirs;
    if(iM&&iT)out[k]=atomic?(_eq(mine[k],base[k])?theirs[k]:mine[k]):merge3(base[k],mine[k],theirs[k]);
    else if(iM&&!iT){if(!(iB&&_eq(mine[k],base[k])))out[k]=mine[k];}
    else if(!iM&&iT){if(!(iB&&_eq(theirs[k],base[k])))out[k]=theirs[k];}});
  return out;
}
function merge3(base,mine,theirs){
  if(mine===undefined)return theirs; if(theirs===undefined)return mine;
  const mo=mine&&typeof mine==='object',to=theirs&&typeof theirs==='object';
  if(!mo||!to||Array.isArray(mine)!==Array.isArray(theirs))return _eq(mine,base)?theirs:mine; // folha/scalar: meu se mudei, senão dele
  if(Array.isArray(mine))return (mine.every(_isRec)&&theirs.every(_isRec))?_mergeArr(base,mine,theirs):_mergeUnion(base,mine,theirs);
  return _mergeObj(base,mine,theirs,_isIdMap(mine)||_isIdMap(theirs));
}
async function cloudCommit(){ // grava; se outra sessão salvou, mescla e regrava. Retorna 'saved'|'error'|'unresolved'
  for(let att=0;att<5;att++){
    let q=sb.from('marmita_organizacoes').update({dados:DB}).eq('id',ORG.id);
    if(CLOUD_TS)q=q.eq('atualizado_em',CLOUD_TS);
    const {data,error}=await q.select('atualizado_em').maybeSingle();
    if(error)return 'error';
    if(data){CLOUD_TS=data.atualizado_em;CLOUD_BASE=_cloneDB(DB);return 'saved';}
    // 0 linhas → alguém salvou antes: busca a versão do servidor e mescla
    let cur;try{cur=await sb.from('marmita_organizacoes').select('atualizado_em,dados').eq('id',ORG.id).maybeSingle();}catch(e){return 'error';}
    if(!cur||!cur.data)return 'error';
    const theirs=cur.data.dados||{};CLOUD_TS=cur.data.atualizado_em;
    if(_eq(theirs,DB)){CLOUD_BASE=_cloneDB(DB);return 'saved';}     // já é igual ao nosso
    DB=merge3(CLOUD_BASE||theirs,DB,theirs);                         // combina as duas edições
    if(typeof normData==='function')normData();
    _mergeHouve=true;                                               // regrava o resultado no próximo giro do laço
  }
  return 'unresolved';
}
async function cloudFlush(){
  if(!CLOUD||!sb||!ORG||CLOUD_CONFLICT)return;
  setSaveStatus('saving');_mergeHouve=false;
  try{
    const r=await cloudCommit();
    if(r==='saved'){SAVE_RETRY=0;try{localStorage.removeItem(localBackupKey());}catch(e){}setSaveStatus('saved');
      if(_mergeHouve){toast('Alterações de outra pessoa foram mescladas');if(typeof reRenderVista==='function')reRenderVista();}return;}
    if(r==='error'){setSaveStatus('error');scheduleRetry();return;}
    CLOUD_CONFLICT=true;setSaveStatus('conflict');avisarConflito(); // fallback raro
  }catch(e){setSaveStatus('error');scheduleRetry();}
}
function scheduleRetry(){
  SAVE_RETRY=Math.min(SAVE_RETRY+1,6);
  const delay=Math.min(30000,1000*Math.pow(2,SAVE_RETRY));
  clearTimeout(window._cloudRetry);window._cloudRetry=setTimeout(cloudFlush,delay);
}

async function arquivarCliente(orgId,arq){
  try{const o=(await sb.from('marmita_organizacoes').select('dados').eq('id',orgId).single()).data;const dados=(o&&o.dados)||{};dados._arquivado=!!arq;
    await sb.from('marmita_organizacoes').update({dados}).eq('id',orgId);}catch(e){return toast('Erro ao '+(arq?'arquivar':'restaurar'));}
  toast(arq?'Cliente arquivado':'Cliente restaurado');showAdmin();}
async function excluirCliente(orgId,nome){
  if(!confirm('EXCLUIR definitivamente "'+nome+'"?\n\nIsso remove o restaurante, todos os dados e os acessos vinculados. NÃO pode ser desfeito.\n\nDica: se só quer parar de usar, use Arquivar.'))return;
  if(!confirm('Tem certeza? Esta ação é irreversível.'))return;
  try{const ps=(await sb.from('marmita_perfis').select('id').eq('org_id',orgId)).data||[];
    for(const p of ps){try{await chamarFn('criar-membro',{acao:'remover',authId:p.id});}catch(e){}}
    await sb.from('marmita_organizacoes').delete().eq('id',orgId);}catch(e){return toast('Erro ao excluir');}
  toast('Cliente excluído');showAdmin();}
function clientesDe(cid){return ADMIN_ORGS.filter(o=>o.consultor_id===cid&&!(o.dados&&o.dados._arquivado)).length;}
function novoCliente(){
  if(!IS_SUPER&&MY_LIMITE&&clientesDe(MY_UID)>=MY_LIMITE){
    return modal(`<div class="modal-head"><h3>Limite atingido</h3><button class="x" onclick="closeModal()">${icoX}</button></div>
    <div class="modal-body"><div style="font-size:13.5px;color:var(--muted)">Você atingiu o limite de <b>${MY_LIMITE} clientes</b> do seu plano. Para adicionar mais, fale com a Lidera para aumentar o seu limite.</div></div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="closeModal()">Entendi</button></div>`);
  }
  const consSel=IS_SUPER&&CONSULTORES.length?`<div class="field"><label>Consultor responsável</label><select class="input" id="nc_cons"><option value="">Lidera (você)</option>${CONSULTORES.map(c=>`<option value="${c.id}">${esc(c.nome||c.email||'Consultor')} · ${clientesDe(c.id)}/${c.limite_clientes!=null?c.limite_clientes:5}</option>`).join('')}</select></div>`:'';
  modal(`<div class="modal-head"><h3>Novo cliente</h3><button class="x" onclick="closeModal()">${icoX}</button></div>
  <div class="modal-body">
    <div id="nc_err" style="display:none;background:var(--red-bg);color:var(--red);font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:12px"></div>
    <div class="field"><label>Nome do restaurante</label><input class="input" id="nc_nome" placeholder="Ex.: Restaurante Lidera"></div>
    <div class="field"><label>Responsável</label><input class="input" id="nc_resp" placeholder="Nome do responsável"></div>
    ${consSel}
    <div style="font-size:12px;color:var(--soft)">O dono cria a conta dele na tela <b>Criar conta</b> do app. Depois é só vincular aqui, no cartão <b>Novos cadastros aguardando liberação</b>.</div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="doNovoCliente()">Criar cliente</button></div>`);
  setTimeout(()=>{const e=$('#nc_nome');if(e)e.focus();},40);
}
async function doNovoCliente(){
  const nome=$('#nc_nome').value.trim(),resp=$('#nc_resp').value.trim();
  const err=$('#nc_err');const showErr=m=>{if(err){err.style.display='block';err.textContent=m;}};
  if(!nome)return showErr('Informe o nome do restaurante.');
  const consId=IS_SUPER?(($('#nc_cons')&&$('#nc_cons').value)||null):MY_UID;
  if(consId){const c=CONSULTORES.find(x=>x.id===consId);const lim=consId===MY_UID&&!IS_SUPER?MY_LIMITE:(c?(c.limite_clientes!=null?c.limite_clientes:5):null);
    if(lim&&clientesDe(consId)>=lim)return showErr('Limite de '+lim+' clientes atingido para '+(IS_SUPER?'esse consultor':'você')+'.');}
  const btn=document.querySelector('.modal-foot .btn-primary');if(btn){btn.disabled=true;btn.textContent='Criando…';}
  let res;try{res=await sb.from('marmita_organizacoes').insert({nome,responsavel:resp,status:'ativo',dados:{},consultor_id:consId||null}).select('id').single();}catch(e){res={error:e};}
  if(btn){btn.disabled=false;btn.textContent='Criar cliente';}
  if(res.error)return showErr('Não foi possível criar: '+(res.error.message||res.error));
  const novoId=res.data&&res.data.id;
  modal(`<div class="modal-head"><h3>Cliente criado ✓</h3><button class="x" onclick="closeModal();showAdmin()">${icoX}</button></div>
  <div class="modal-body">
    <div style="font-size:13.5px;color:var(--muted);margin-bottom:14px"><b>${esc(nome)}</b> foi criado. Peça ao dono para criar a conta dele na tela <b>Criar conta</b> do app; o cadastro aparece aqui em <b>Novos cadastros aguardando liberação</b> e você o vincula a este restaurante.</div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal();showAdmin()">Concluir</button>${novoId?`<button class="btn btn-primary" onclick="closeModal();abrirCliente('${novoId}')">Abrir e configurar acesso</button>`:''}</div>`);}
async function vincularPerfil(perfilId,orgId){if(!orgId)return;await sb.from('marmita_perfis').update({org_id:orgId}).eq('id',perfilId);toast('Cliente vinculado');showAdmin();}
/* ---- DONO MULTI-UNIDADE: um login (cliente) administra várias unidades. Liga as unidades via organizacoes.consultor_id = id do login. ---- */
async function donoModal(orgId){
  const o=ADMIN_ORGS.find(x=>x.id===orgId);if(!o)return;
  let dono=null;
  if(o.consultor_id){try{dono=(await sb.from('marmita_perfis').select('id,email,nome,papel').eq('id',o.consultor_id).maybeSingle()).data;}catch(e){}}
  const ehConsultor=dono&&(dono.papel==='consultor'||dono.papel==='admin');
  // unidades já ligadas a esse dono (dentre as carregadas no painel)
  const irmas=(o.consultor_id?ADMIN_ORGS.filter(x=>x.consultor_id===o.consultor_id&&!(x.dados&&x.dados._demo)):[]);
  const listaIrmas=irmas.length?`<div style="font-size:12px;color:var(--muted);margin:10px 0 4px">Unidades deste dono (${irmas.length}):</div>
    <div class="cat-scroll" style="max-height:150px">${irmas.map(u=>`<div class="cat-row"><span>${esc(u.nome||'')}${u.id===orgId?' <span class="cat-badge">esta</span>':''}</span></div>`).join('')}</div>`:'';
  const atual=dono?(ehConsultor
      ?`<div class="alert alert-amber" style="margin-bottom:12px">${typeof icoWarn!=='undefined'?icoWarn:''}<div>Esta unidade está vinculada a um <b>consultor</b> (${esc(dono.email||dono.nome||'')}), não a um dono. Para dono multi-unidade, use um login de cliente.</div></div>`
      :`<div class="alert alert-green" style="margin-bottom:12px">${typeof icoOk!=='undefined'?icoOk:''}<div>Dono atual: <b>${esc(dono.nome||dono.email||'')}</b><br><span style="font-size:12px;color:var(--muted)">${esc(dono.email||'')}</span></div></div>`)
    :`<div style="font-size:13px;color:var(--muted);margin-bottom:12px">Esta unidade ainda não tem um dono multi-unidade. Informe o e-mail do login que vai gerenciar esta e as outras unidades dele.</div>`;
  modal(`<div class="modal-head"><h3>Dono / Multi-unidade</h3><button class="x" onclick="closeModal()">${icoX}</button></div>
  <div class="modal-body">
    <div style="font-weight:600;margin-bottom:8px">${esc(o.nome||'')}</div>
    ${atual}
    <div class="field"><label>E-mail do dono <span class="hint">login de cliente já existente</span></label>
      <input class="input" id="dono_email" placeholder="dono@exemplo.com" value="${dono&&!ehConsultor?esc(dono.email||''):''}" onkeydown="if(event.key==='Enter')donoVincular('${orgId}')"></div>
    <div style="font-size:12px;color:var(--muted);margin-top:6px">O dono precisa ter criado a conta (tela <b>Criar conta</b>) antes. Repita este passo em cada unidade dele, usando o mesmo e-mail. Ao entrar, ele escolhe a unidade num seletor e tem acesso total a cada uma.</div>
  </div>
  <div class="modal-foot">${(dono&&!ehConsultor)?`<button class="btn btn-ghost" style="color:var(--red)" onclick="donoDesvincular('${orgId}')">Desvincular</button>`:''}<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="donoVincular('${orgId}')">Vincular dono</button></div>`);
  setTimeout(()=>{const el=$('#dono_email');if(el)el.focus();},60);
}
async function donoVincular(orgId){
  const email=(($('#dono_email')&&$('#dono_email').value)||'').trim().toLowerCase();if(!email)return showErr('Informe o e-mail do dono.');
  let perfil=null;try{perfil=(await sb.from('marmita_perfis').select('id,email,nome,papel').ilike('email',email).maybeSingle()).data;}catch(e){}
  if(!perfil)return showErr('Não encontrei um login com esse e-mail. O dono precisa criar a conta em "Criar conta" antes de ser vinculado.');
  if(perfil.papel==='consultor'||perfil.papel==='admin')return showErr('Esse e-mail é de um consultor/admin. Use um login de cliente para dono de unidades.');
  try{const r=await sb.from('marmita_organizacoes').update({consultor_id:perfil.id}).eq('id',orgId);if(r.error)throw r.error;}catch(e){return showErr('Não foi possível vincular: '+((e&&e.message)||e));}
  toast('Unidade vinculada ao dono ✓');closeModal();await showAdmin();
}
async function donoDesvincular(orgId){
  if(!confirm('Desvincular esta unidade do dono? Ele deixa de ver esta unidade no seletor.'))return;
  try{const r=await sb.from('marmita_organizacoes').update({consultor_id:null}).eq('id',orgId);if(r.error)throw r.error;}catch(e){return showErr('Erro ao desvincular.');}
  toast('Unidade desvinculada');closeModal();await showAdmin();
}

/* ---- SUPER ADMIN · Consultores (revenda) ---- */
function consBox(){let b=document.getElementById('consScreen');if(!b){b=document.createElement('div');b.id='consScreen';b.style.cssText='position:fixed;inset:0;z-index:260;background:var(--bg);overflow:auto';document.body.appendChild(b);}return b;}
function fecharConsultores(){const b=document.getElementById('consScreen');if(b)b.style.display='none';showAdmin();}
async function showConsultores(){if(!IS_SUPER)return;const b=consBox();b.style.display='block';hideAdmin();
  b.innerHTML=`<div class="admin-wrap"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
    <div><div style="font-family:'Fraunces',serif;font-size:26px;font-weight:700">👥 Consultores</div><div style="font-size:13px;color:var(--muted)">Parceiros que revendem o Marmita Lucrativa e gerenciam a própria carteira</div></div>
    <div style="display:flex;gap:10px"><button class="btn btn-primary" onclick="novoConsultor()">${icoPlus} Novo consultor</button><button class="btn btn-ghost" onclick="fecharConsultores()">← Voltar</button></div></div>
    <div id="cons_body"><div style="color:var(--muted)">Carregando…</div></div></div>`;
  try{CONSULTORES=(await sb.from('marmita_perfis').select('*').eq('papel','consultor').order('nome',{ascending:true})).data||[];}catch(e){CONSULTORES=[];}
  try{const d=(await sb.from('marmita_organizacoes').select('*')).data;if(d)ADMIN_ORGS=d;}catch(e){}
  renderConsultores();
}
function renderConsultores(){const el=$('#cons_body');if(!el)return;
  if(!CONSULTORES.length){el.innerHTML=`<div class="card card-pad" style="color:var(--muted)">Nenhum consultor ainda. Clique em “Novo consultor” para cadastrar o primeiro parceiro.</div>`;return;}
  el.innerHTML=`<div class="admin-grid">${CONSULTORES.map(c=>{const n=clientesDe(c.id);const lim=c.limite_clientes!=null?c.limite_clientes:5;const cheio=n>=lim;const nm=(c.nome||c.email||'').replace(/'/g,'');return `
    <div class="client-card">
      <div style="font-weight:700;font-size:15px">${esc(c.nome||'(sem nome)')}</div>
      <div style="font-size:12px;color:var(--soft)">${esc(c.email||'')}</div>
      <div style="margin:12px 0;font-size:13px">Clientes: <b style="color:${cheio?'var(--red)':'var(--navy)'}">${n}</b> <span style="color:var(--soft)">/ ${lim}</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="verClientesCons('${c.id}')">Ver clientes</button>
        <button class="btn btn-ghost btn-sm" onclick="consEditarLimite('${c.id}')">Limite</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="consRemover('${c.id}','${nm}')">Remover</button>
      </div>
    </div>`;}).join('')}</div>`;
}
function verClientesCons(cid){adminConsFiltro=cid;fecharConsultores();}
function novoConsultor(){modal(`<div class="modal-head"><h3>Novo consultor</h3><button class="x" onclick="closeModal()">${icoX}</button></div>
  <div class="modal-body">
    <div id="ncs_err" style="display:none;background:var(--red-bg);color:var(--red);font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:12px"></div>
    <div class="field"><label>Nome do consultor</label><input class="input" id="ncs_nome" placeholder="Ex.: João Consultoria"></div>
    <div class="field"><label>E-mail (login)</label><input class="input" id="ncs_email" type="email" placeholder="email@consultor.com"></div>
    <div class="field"><label>Senha provisória</label><input class="input" id="ncs_senha" placeholder="mín. 6 caracteres"></div>
    <div class="field"><label>Limite de clientes</label><input class="input" id="ncs_limite" type="number" value="5" min="1" style="max-width:120px"></div>
    <div style="font-size:12px;color:var(--soft)">Se o login já existir, deixe a senha em branco para apenas <b>promover</b> a conta a consultor.</div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="doNovoConsultor()">Criar consultor</button></div>`);setTimeout(()=>{const e=$('#ncs_nome');if(e)e.focus();},40);}
async function doNovoConsultor(){const nome=($('#ncs_nome').value||'').trim(),email=($('#ncs_email').value||'').trim().toLowerCase(),senha=($('#ncs_senha').value||'').trim(),limite=parseInt($('#ncs_limite').value)||5;
  const err=$('#ncs_err');const showErr=m=>{if(err){err.style.display='block';err.textContent=m;}};
  if(!email)return showErr('Informe o e-mail do consultor.');
  const btn=document.querySelector('.modal-foot .btn-primary');if(btn){btn.disabled=true;btn.textContent='Criando…';}
  const fim=()=>{if(btn){btn.disabled=false;btn.textContent='Criar consultor';}};
  if(senha){if(senha.length<6){fim();return showErr('A senha precisa ter ao menos 6 caracteres.');}
    let res;try{res=await chamarFn('criar-membro',{acao:'criar',email,senha,nome});}catch(e){res={data:{error:e.message}};}
    const e2=res&&res.data&&res.data.error;
    if(e2&&!/exist|already|duplic|registrad|cadastrad/i.test(''+e2)){fim();return showErr('Não foi possível criar o login: '+e2+'. Se preferir, crie a conta no Supabase e depois promova aqui (deixe a senha em branco).');}
  }
  let up;try{up=await sb.from('marmita_perfis').update({papel:'consultor',nome,limite_clientes:limite,org_id:null}).eq('email',email).select('id');}catch(e){up={error:e};}
  fim();
  if((up&&up.error)||!up.data||!up.data.length)return showErr('Não encontrei esse login. Informe uma senha para criar a conta, ou crie no Supabase e tente de novo.');
  closeModal();toast('Consultor pronto ✓');showConsultores();}
async function consEditarLimite(cid){const c=CONSULTORES.find(x=>x.id===cid);if(!c)return;const v=prompt('Limite de clientes para '+(c.nome||c.email)+':',c.limite_clientes!=null?c.limite_clientes:5);if(v==null)return;const n=parseInt(v);if(!(n>=1))return toast('Valor inválido');
  try{await sb.from('marmita_perfis').update({limite_clientes:n}).eq('id',cid);}catch(e){return toast('Erro ao salvar');}c.limite_clientes=n;renderConsultores();toast('Limite atualizado para '+n);}
async function consRemover(cid,nome){const n=clientesDe(cid);if(!confirm('Remover o consultor "'+nome+'"?\n\nA conta dele deixa de ser consultor (perde o painel) e os '+n+' cliente(s) dele passam para a Lidera. Os dados dos clientes NÃO são apagados.'))return;
  try{await sb.from('marmita_organizacoes').update({consultor_id:null}).eq('consultor_id',cid);await sb.from('marmita_perfis').update({papel:'cliente'}).eq('id',cid);}catch(e){return toast('Erro ao remover');}
  toast('Consultor removido');showConsultores();}
